<!DOCTYPE html>
<html>
<head>
    <title>Test Broadcast Fix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .pass {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .fail {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Test: Broadcast Messaging Fix</h1>
    <div id="results"></div>

    <script type="module">
        import { inicializarMensajeria, enviarMensaje, registrarIframe, getIframesRegistrados } from '../js/mensajeria.js';
        
        const resultsDiv = document.getElementById('results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            resultsDiv.appendChild(div);
        }
        
        async function runTests() {
            addResult('<h2>Starting Broadcast Tests...</h2>', 'info');
            
            try {
                // Test 1: Initialize mensajeria as padre
                addResult('<h3>Test 1: Initialize mensajeria as padre</h3>', 'info');
                await inicializarMensajeria({ tipo: 'padre' });
                addResult('✅ Mensajeria initialized successfully', 'pass');
                
                // Test 2: Create mock iframes
                addResult('<h3>Test 2: Create and register mock iframes</h3>', 'info');
                const mockIframes = [];
                const receivedMessages = [];
                
                for (let i = 1; i <= 3; i++) {
                    const mockIframe = document.createElement('iframe');
                    mockIframe.id = `test-iframe-${i}`;
                    mockIframe.style.display = 'none';
                    document.body.appendChild(mockIframe);
                    
                    // Mock contentWindow with postMessage
                    const messages = [];
                    mockIframe.contentWindow = {
                        postMessage: function(message, targetOrigin) {
                            console.log(`Mock iframe ${i} received:`, message);
                            messages.push(message);
                            receivedMessages.push({ iframe: i, message });
                        }
                    };
                    
                    mockIframes.push({ iframe: mockIframe, messages });
                    
                    // Register the iframe
                    const registered = registrarIframe(`test-iframe-${i}`, mockIframe);
                    if (registered) {
                        addResult(`✅ Registered test-iframe-${i}`, 'pass');
                    } else {
                        addResult(`❌ Failed to register test-iframe-${i}`, 'fail');
                    }
                }
                
                // Test 3: Check registered iframes count
                addResult('<h3>Test 3: Verify registered iframes</h3>', 'info');
                const registeredIframes = getIframesRegistrados();
                addResult(`Registered iframes count: ${registeredIframes.size}`, 'info');
                
                if (registeredIframes.size >= 3) {
                    addResult('✅ All mock iframes registered', 'pass');
                } else {
                    addResult(`❌ Expected 3+ iframes, got ${registeredIframes.size}`, 'fail');
                }
                
                // Test 4: Send broadcast message
                addResult('<h3>Test 4: Send broadcast message</h3>', 'info');
                const broadcastMsg = {
                    tipo: 'TEST.BROADCAST',
                    datos: { test: 'broadcast message' }
                };
                
                const result = await enviarMensaje(broadcastMsg, 'broadcast');
                
                if (result) {
                    addResult('✅ Broadcast message sent successfully', 'pass');
                } else {
                    addResult('❌ Broadcast message failed to send', 'fail');
                }
                
                // Test 5: Verify all iframes received the message
                addResult('<h3>Test 5: Verify message reception</h3>', 'info');
                await new Promise(resolve => setTimeout(resolve, 100)); // Wait for async processing
                
                let allReceived = true;
                for (let i = 0; i < mockIframes.length; i++) {
                    const { iframe, messages } = mockIframes[i];
                    if (messages.length > 0) {
                        addResult(`✅ ${iframe.id} received ${messages.length} message(s)`, 'pass');
                    } else {
                        addResult(`❌ ${iframe.id} received no messages`, 'fail');
                        allReceived = false;
                    }
                }
                
                if (allReceived) {
                    addResult('✅ All iframes received the broadcast', 'pass');
                } else {
                    addResult('❌ Not all iframes received the broadcast', 'fail');
                }
                
                // Test 6: Send to specific iframe (not broadcast)
                addResult('<h3>Test 6: Send to specific iframe</h3>', 'info');
                const specificMsg = {
                    tipo: 'TEST.SPECIFIC',
                    datos: { test: 'specific message' }
                };
                
                const specificResult = await enviarMensaje(specificMsg, 'test-iframe-1');
                
                if (specificResult) {
                    addResult('✅ Specific message sent successfully', 'pass');
                } else {
                    addResult('❌ Specific message failed to send', 'fail');
                }
                
                // Cleanup
                addResult('<h3>Cleanup: Removing mock iframes</h3>', 'info');
                mockIframes.forEach(({ iframe }) => {
                    document.body.removeChild(iframe);
                });
                
                addResult('<h2>✅ All Tests Completed!</h2>', 'pass');
                
                // Summary
                addResult(`<h3>Summary</h3>
                    <pre>${JSON.stringify({
                        totalRegistered: registeredIframes.size,
                        messagesReceived: receivedMessages.length,
                        broadcastSuccess: result,
                        specificSuccess: specificResult
                    }, null, 2)}</pre>`, 'info');
                
            } catch (error) {
                addResult(`<h2>❌ Test Error</h2><pre>${error.stack}</pre>`, 'fail');
            }
        }
        
        // Run tests when page loads
        runTests();
    </script>
</body>
</html>
