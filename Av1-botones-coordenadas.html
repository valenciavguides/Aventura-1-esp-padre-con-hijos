<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Av1-botones-coordenadas-(hijo2)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --btn-size: 60px;
            --icon-size: 1.3em;
            --progress-thick: 12px;
            --trapecio-width: 280px;
            --trapecio-height: 180px; /* Aumentado para acomodar los nuevos botones */
            --trapecio-bg: white;
            --trapecio-shadow: 0 2px 10px rgba(0,0,0,0.15);
            --trapecio-radius: 12px;
            --progress-color: #0077cc;
            --progress-bg: #e0e0e0;
            --timer-font-size: 1.0em;
            --timer-color: #333;
        }

        /* Encapsular estilos */
        .hijo2-container body, .hijo2-container html {
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent !important;
            font-family: Arial, sans-serif;
        }

        /* Contenedor principal con forma trapezoidal */
        .container {
            width: var(--trapecio-width);
            height: var(--trapecio-height);
            background: var(--trapecio-bg);
            border-radius: var(--trapecio-radius);
            box-shadow: var(--trapecio-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            gap: 0.2em;
            z-index: 1200;
            padding: 5px 8px;
            box-sizing: border-box;
            border: none;
            margin: 0 auto;
        }

        .botones-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .boton {
            width: var(--btn-size);
            height: var(--btn-size);
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: white;
            font-size: var(--icon-size);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            padding: 0;
        }

        .boton.activo {
            background: linear-gradient(135deg, #007bff, #0056b3);
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .boton:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .boton:active {
            transform: scale(0.95);
        }

        .boton.disabled {
            background: linear-gradient(135deg, #dc3545, #bd2130);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .boton.disabled:hover {
            transform: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        /* Control individual del tamaño de iconos */
        .icon-gps {
            font-size: 1.2em;
        }

        .icon-imagen {
            font-size: 1.1em;
        }

        .icon-video {
            font-size: 1.1em;
        }

        /* Estilos para los nuevos botones */
        .icon-ubicacion {
            font-size: 1.2em;
            transform: rotate(180deg); /* Girar el emoji 180 grados */
            display: inline-block;
        }

        .icon-mapa-completo {
            font-size: 1.2em;
        }

        .icon-mapa-jpg {
            font-size: 1.2em;
        }

        .status {
            width: 100%;
            text-align: center;
            font-size: 0.9em;
            padding: 5px 0;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.7);
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 24px;
        }

        .gps-icon {
            animation: pulse 1.5s infinite;
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        /* Media queries para móviles */
        @media (max-width: 500px) {
            .container {
                width: calc(var(--trapecio-width) * 0.9);
                height: calc(var(--trapecio-height) * 0.9);
            }
            .boton {
                width: calc(var(--btn-size) * 0.9);
                height: calc(var(--btn-size) * 0.9);
            }
            .status {
                font-size: 0.8em;
            }
        }

        /* Mantenemos algunos estilos originales para compatibilidad */
        body.controles-deshabilitados .container {
            opacity: 0.7;
            pointer-events: none;
        }

        /* Estilos para el cambio de modo - Simplificados */
        .modo-aventura #btn-gps.activo {
            animation: pulse 1.5s infinite;
        }

        /* Estilos del Modal para imagen/video */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 90%;
            max-height: 90%;
            position: relative;
            overflow: hidden;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            color: #333;
            cursor: pointer;
            background: #f1f1f1;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .modal-title {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.2em;
            color: #333;
        }
        .media-container img, .media-container video {
            max-width: 100%;
            max-height: 70vh;
            display: block;
            margin: 0 auto;
            border-radius: 5px;
        }

        /* Estilo para la línea de ruta */
        .ruta-polyline {
            stroke: #0077ff;
            stroke-width: 6px;
            stroke-opacity: 0.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Estilo para el botón de ubicación actual con texto */
        .ubicacion-btn {
            font-size: 0.65em;
            text-align: center;
            line-height: 1.1;
            padding: 2px;
            white-space: nowrap;
            overflow: hidden;
            font-weight: bold;
        }

        /* Ajustar altura del contenedor para acomodar 6 botones */
        .container {
            height: 200px;
        }

        /* Estilos para el estado del GPS */
        .gps-activo {
            background-color: #d4edda;
            color: #155724;
        }
        
        .gps-inactivo {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

// ==================== INICIALIZACIÓN DE MENSAJERÍA ====================

import { inicializarMensajeria, registrarControlador, enviarMensaje } from './js/mensajeria.js';
import { TIPOS_MENSAJE } from './js/constants.js';
import logger from './js/logger.js';

const CONFIG_HIJO = {
    IFRAME_ID: 'hijo2',
    COMPONENTE_ID: 'COORDENADAS',
    DEBUG: true
};

// Estado del componente
const estadoComponente = {
    modo: 'casa',
    gpsActivo: false,
    watchId: null,
    ultimaActualizacionGPS: 0,
    intervaloMinimo: 5000, // 5 segundos entre actualizaciones para ahorrar batería
    posicionUsuario: null,
    paradaActual: null,
    distanciaAlDestino: null,
    tipoParadaActual: null, // 'parada' o 'tramo'
    idParadaActual: null,  // 'P-X' o 'TR-X'
    controlesHabilitados: true,
    datosRecibidos: false, // Flag para evitar procesamiento duplicado de datos
    arrayParadasLocal: null, // Array de paradas recibido del padre
    inicializado: false, // Estado de inicialización del componente
    elementosDOM: {}, // Referencias a botones
    botonesActivos: {
        gps: false,
        imagen: false,
        video: false,
        ubicacion: false,
        mapaCompleto: true, // Siempre activo
        mapaJpg: true       // Siempre activo
    }
};

// Referencias DOM
const elementosDOM = {
    btnGps: document.getElementById('btn-gps'),
    btnImagen: document.getElementById('btn-imagen'),
    btnVideo: document.getElementById('btn-video'),
    btnUbicacion: document.getElementById('btn-ubicacion'),
    btnMapaCompleto: document.getElementById('btn-mapa-completo'),
    btnMapaJpg: document.getElementById('btn-mapa-jpg')
};
const statusElement = document.getElementById('status');

// Función para actualizar estado visual
function actualizarEstado(mensaje, tipo = 'info') {
    if (statusElement) {
        statusElement.textContent = mensaje;
        statusElement.className = `status ${tipo}`;
    }
}

// Función para marcar botón como activo
function setBotonActivo(botonId) {
    Object.values(elementosDOM).forEach(btn => btn?.classList.remove('activo'));
    if (elementosDOM[botonId]) {
        elementosDOM[botonId].classList.add('activo');
    }
}

// Función para desactivar un botón
function desactivarBoton(boton) {
    if (!boton) return;
    boton.disabled = true;
    boton.classList.add('disabled');
    boton.setAttribute('aria-disabled', 'true');
    boton.setAttribute('title', 'Función no disponible en este momento');
}

// Función para activar un botón
function activarBoton(boton, titulo = '') {
    if (!boton) return;
    boton.disabled = false;
    boton.classList.remove('disabled');
    boton.setAttribute('aria-disabled', 'false');
    if (titulo) {
        boton.setAttribute('title', titulo);
    }
}

// Actualizar los estados de todos los botones según reglas específicas
function actualizarEstadoBotones() {
    const {
        modo,
        posicionUsuario,
        distanciaAlDestino,
        tipoParadaActual,
        idParadaActual,
        elementosDOM,
        controlesHabilitados
    } = estadoComponente;

    // Si los controles están deshabilitados globalmente, desactivar todo
    if (!controlesHabilitados) {
        Object.values(elementosDOM).forEach(boton => desactivarBoton(boton));
        return;
    }

    // 🎥 VIDEO: habilitado siempre en modo casa Y cuando es tramo (TR-X) entre 5-20m en modo aventura
    if (elementosDOM.btnVideo) {
        const esTramo = tipoParadaActual === 'tramo' || (idParadaActual && idParadaActual.startsWith('TR-'));
        const distanciaEnRango = distanciaAlDestino !== null && distanciaAlDestino >= 5 && distanciaAlDestino <= 20;

        if (modo === 'casa' || (modo === 'aventura' && esTramo && distanciaEnRango)) {
            activarBoton(elementosDOM.btnVideo);
            console.log('🎥 Botón video ACTIVADO');
        } else {
            desactivarBoton(elementosDOM.btnVideo);
            console.log('🎥 Botón video DESACTIVADO');
        }
    }

    // 📷 IMAGEN: habilitado siempre en ambos modos
    if (elementosDOM.btnImagen) {
        activarBoton(elementosDOM.btnImagen);
        console.log('📷 Botón imagen SIEMPRE ACTIVADO');
    }

    // 🛰️ GPS: Solo entre 5-20m en aventura, envía mensajes específicos al padre
    if (elementosDOM.btnGps) {
        if (modo === 'casa') {
            desactivarBoton(elementosDOM.btnGps);
            console.log('🛰️ Botón GPS DESACTIVADO: modo casa');
        } else if (distanciaAlDestino !== null && distanciaAlDestino >= 5 && distanciaAlDestino <= 20) {
            activarBoton(elementosDOM.btnGps);
            console.log(`🛰️ Botón GPS ACTIVADO: distancia ${distanciaAlDestino.toFixed(1)}m (5-20m)`);
            // Enviar mensaje al padre: este ID está en rango, tienes permiso para activar GPS
            enviarMensaje({
                tipo: TIPOS_MENSAJE.NAVEGACION.GPS.PERMITIDO,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: 'padre',
                datos: {
                    idParada: idParadaActual,
                    distancia: distanciaAlDestino,
                    permiso: 'gps_completo'
                }
            });
        } else {
            desactivarBoton(elementosDOM.btnGps);
            console.log(`🛰️ Botón GPS DESACTIVADO: distancia ${distanciaAlDestino?.toFixed(1) || 'desconocida'}m (fuera de 5-20m)`);
            // Enviar mensaje: fuera de rango, solo imagen disponible
            enviarMensaje({
                tipo: TIPOS_MENSAJE.NAVEGACION.GPS.RESTRINGIDO,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: 'padre',
                datos: {
                    idParada: idParadaActual,
                    distancia: distanciaAlDestino,
                    disponible: 'solo_imagen'
                }
            });
        }
    }

    // 📍 UBICACIÓN: Solo aventura >10.50m, cambia automáticamente a siguiente parada
    if (elementosDOM.btnUbicacion) {
        if (modo === 'casa') {
            desactivarBoton(elementosDOM.btnUbicacion);
            console.log('🧭 Botón ubicación DESACTIVADO: modo casa');
        } else if (distanciaAlDestino !== null && distanciaAlDestino > 10.50) {
            activarBoton(elementosDOM.btnUbicacion);
            console.log(`🧭 Botón ubicación ACTIVADO: distancia ${distanciaAlDestino.toFixed(1)}m (>10.50m)`);
            // Enviar mensaje: parada actual finalizada, siguiente en array
            enviarMensaje({
                tipo: TIPOS_MENSAJE.NAVEGACION.PARADA_COMPLETADA,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: 'padre',
                datos: {
                    idParadaActual: idParadaActual,
                    distancia: distanciaAlDestino,
                    accion: 'siguiente_parada'
                }
            });
        } else {
            desactivarBoton(elementosDOM.btnUbicacion);
            console.log(`🧭 Botón ubicación DESACTIVADO: distancia ${distanciaAlDestino?.toFixed(1) || 'desconocida'}m (≤10.50m)`);
        }
    }

    // Botones de mapa completo y mapa JPG siempre están habilitados
    if (elementosDOM.btnMapaCompleto) {
        activarBoton(elementosDOM.btnMapaCompleto);
    }

    if (elementosDOM.btnMapaJpg) {
        activarBoton(elementosDOM.btnMapaJpg);
    }
}

// Inicializar estado de botones al cargar
document.addEventListener('DOMContentLoaded', () => {
    actualizarEstadoBotones();
});

// Event listeners para los botones
elementosDOM.btnGps?.addEventListener('click', async () => {
    try {
        if (estadoComponente.modo === 'casa') {
            actualizarEstado('GPS no disponible en modo casa', 'warn');
            return;
        }

        if (estadoComponente.distanciaAlDestino === null ||
            estadoComponente.distanciaAlDestino < 5 ||
            estadoComponente.distanciaAlDestino > 20) {
            actualizarEstado('GPS solo disponible entre 5-20m de la parada', 'warn');
            return;
        }

        estadoComponente.gpsActivo = !estadoComponente.gpsActivo;
        setBotonActivo(estadoComponente.gpsActivo ? 'btnGps' : null);

        // Enviar mensaje al padre para activar/desactivar GPS
        await enviarMensaje({
            tipo: TIPOS_MENSAJE.NAVEGACION.GPS.ACTIVAR,
            origen: CONFIG_HIJO.IFRAME_ID,
            destino: 'padre',
            datos: {
                activar: estadoComponente.gpsActivo,
                idParada: estadoComponente.idParadaActual,
                distancia: estadoComponente.distanciaAlDestino
            }
        });

        actualizarEstado(estadoComponente.gpsActivo ? 'GPS activado' : 'GPS desactivado', 'success');
        logger.info(`[hijo2] GPS ${estadoComponente.gpsActivo ? 'activado' : 'desactivado'}`);
    } catch (error) {
        logger.error(`[hijo2] Error al activar GPS:`, error);
        actualizarEstado('Error GPS', 'error');
    }
});

elementosDOM.btnImagen?.addEventListener('click', async () => {
    try {
        setBotonActivo('btnImagen');

// Controlador para cambio de modo
registrarControlador(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO, async (mensaje) => {
    const logPrefix = `[hijo2][CAMBIO_MODO]`;
    const CONFIG_HIJO = { IFRAME_ID: 'hijo2' };

    try {
        // Paso 1: Validar carga secuencial - esperar permiso del padre
        if (!mensaje.datos?.secuenciaCompleta) {
            logger.warn(`${logPrefix} Mensaje recibido antes de secuencia completa, esperando permiso...`);
            // Enviar NACK y esperar mensaje de PERMISO_INICIALIZACION
            await enviarMensaje({
                tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: mensaje.origen,
                datos: { error: 'Secuencia no completa', esperarPermiso: true }
            });
            return;
        }

        // Paso 2: Extraer datos con destructuring
        const { modo } = mensaje.datos || {};

        // Paso 3: Validar datos extraídos
        if (!modo || !['casa', 'aventura'].includes(modo)) {
            logger.error(`${logPrefix} Modo inválido o faltante: ${modo}`);
            await enviarMensaje({
                tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: mensaje.origen,
                datos: { error: 'Modo inválido', modoRecibido: modo }
            });
            return;
        }

        // Paso 4: Loggear éxito y procesar
        logger.info(`${logPrefix} Procesando cambio a modo: ${modo}`);
        
        // Actualizar estado interno
        estadoComponente.modo = modo;

        // Aplicar lógica específica del componente
        actualizarEstadoBotones();

        // Actualizar interfaz visual
        document.body.className = `modo-${modo} hijo2-container`;
        actualizarEstado(`Modo cambiado a: ${modo}`, 'info');

        // Paso 5: Enviar confirmación
        await enviarMensaje({
            tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION,
            origen: CONFIG_HIJO.IFRAME_ID,
            destino: mensaje.origen,
            datos: { modo, exito: true, timestamp: Date.now() }
        });

    } catch (error) {
        logger.error(`${logPrefix} Error procesando cambio de modo:`, error);
        actualizarEstado('Error cambiando modo', 'error');
    }
});

    /**
     * Controlador: DATOS.COORDENADAS_PARADAS_REQUEST
     * Descripción: Envía coordenadas filtradas por paradaId o el array completo al solicitante
     * Origen esperado: padre
     * Respuesta: DATOS.COORDENADAS_PARADAS_RESPONSE
     *
     * Datos recibidos: {
     *     paradaId?: string (opcional - filtra por ID específico),
     *     incluirRutas?: boolean,
     *     incluirMarcadores?: boolean,
     *     actualizarMapa?: boolean,
     *     contexto?: string
     * }
     * Datos enviados: { coordenadas: Array, total: number, exito: boolean, mensajeOriginal: string, paradaId?: string }
     *
     * Ejemplo de uso desde el padre (todas las coordenadas):
     * await enviarMensaje({
     *     tipo: TIPOS_MENSAJE.DATOS.COORDENADAS_PARADAS_REQUEST,
     *     origen: 'padre',
     *     destino: 'hijo2',
     *     datos: {}
     * });
     *
     * Ejemplo de uso desde el padre (coordenadas específicas):
     * await enviarMensaje({
     *     tipo: TIPOS_MENSAJE.DATOS.COORDENADAS_PARADAS_REQUEST,
     *     origen: 'padre',
     *     destino: 'hijo2',
     *     datos: { paradaId: 'TR-2' }
     * });
     */
    registrarControlador(TIPOS_MENSAJE.DATOS.COORDENADAS_PARADAS_REQUEST, async (mensaje) => {
        const logPrefix = `[hijo2][COORDENADAS_PARADAS_REQUEST][${mensaje?.origen || 'desconocido'}]`;

        try {
            logger.debug(`${logPrefix} ===== SOLICITUD RECIBIDA =====`);
            logger.debug(`${logPrefix} Datos completos del mensaje:`, mensaje.datos);
            logger.debug(`${logPrefix} paradaId recibido: ${mensaje.datos?.paradaId}`);
            logger.debug(`${logPrefix} contexto: ${mensaje.datos?.contexto}`);
            logger.debug(`${logPrefix} incluirRutas: ${mensaje.datos?.incluirRutas}`);

            // Validar que el array existe
            if (!CoordenadasParadas || CoordenadasParadas.length === 0) {
                throw new Error('Array de coordenadas no disponible o vacío');
            }

            const { paradaId, contexto, modo } = mensaje.datos || {};
            let coordenadasFiltradas = CoordenadasParadas;
            let mensajeInfo = 'coordenadas completas';

            logger.debug(`${logPrefix} Total coordenadas disponibles: ${CoordenadasParadas.length}`);
            logger.debug(`${logPrefix} IDs disponibles:`, CoordenadasParadas.map(c => c.id));

            // Si se especifica paradaId, filtrar por ese ID específico
            if (paradaId) {
                logger.info(`${logPrefix} FILTRANDO POR paradaId: ${paradaId}`);
                coordenadasFiltradas = CoordenadasParadas.filter(coord => coord.id === paradaId);
                mensajeInfo = `coordenadas filtradas para ${paradaId}`;

                logger.info(`${logPrefix} FILTRANDO: paradaId=${paradaId}, total antes=${CoordenadasParadas.length}, despues=${coordenadasFiltradas.length}`);
                logger.debug(`${logPrefix} Coordenadas encontradas:`, coordenadasFiltradas.map(c => ({id: c.id, tipo: c.tipo, nombre: c.nombre})));

                // Para cambios individuales en modo casa, antiguamente se simplificaban tramos a un solo punto
                // Si la solicitud explícitamente pide rutas (`incluirRutas: true`) respetamos la estructura completa
                if (contexto === 'cambio_parada_individual' && coordenadasFiltradas.length === 1) {
                    const coord = coordenadasFiltradas[0];
                    const solicitarRutas = mensaje.datos?.incluirRutas === true;
                    if (coord.tipo === 'tramo' && coord.fin && !solicitarRutas) {
                        // Convertir tramo a un solo punto usando las coordenadas finales
                        coordenadasFiltradas = [{
                            id: coord.id,
                            tipo: 'tramo',
                            parada: coord.tramo, // Usar el número de tramo como parada
                            nombre: coord.nombre,
                            coordenadas: coord.fin // Usar punto final como coordenadas del marcador
                        }];
                        logger.debug(`${logPrefix} Tramo simplificado a punto único:`, coordenadasFiltradas[0]);
                    } else if (coord.tipo === 'tramo' && solicitarRutas) {
                        logger.debug(`${logPrefix} Solicitud incluye rutas; devolviendo tramo completo con inicio/waypoints/fin`);
                        // Dejar coord tal cual (inicio/waypoints/fin) para que el mapa dibuje la polyline
                    }
                }
            } 
            // Si es inicialización en modo casa, no devolver coordenadas
            else if (contexto === 'inicializacion' && modo === 'CASA') {
                coordenadasFiltradas = [];
                mensajeInfo = 'modo casa inicial - sin coordenadas';
                logger.debug(`${logPrefix} Modo casa inicial: no se devuelven coordenadas`);
            }

            // Enviar RESPONSE con las coordenadas (filtradas o completas)
            logger.info(`${logPrefix} ===== ENVIANDO RESPONSE =====`);
            logger.info(`${logPrefix} Enviando ${coordenadasFiltradas.length} ${mensajeInfo}`);
            logger.debug(`${logPrefix} Datos del response:`, {
                total: coordenadasFiltradas.length,
                exito: true,
                paradaId: paradaId,
                coordenadasIds: coordenadasFiltradas.map(c => c.id),
                destino: mensaje.origen
            });

            await enviarMensaje({
                tipo: TIPOS_MENSAJE.DATOS.COORDENADAS_PARADAS_RESPONSE,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: mensaje.origen,
                datos: {
                    coordenadas: coordenadasFiltradas,
                    total: coordenadasFiltradas.length,
                    exito: true,
                    paradaId: paradaId, // Incluir el paradaId solicitado para contexto
                    mensajeOriginal: mensaje.id
                }
            });

            logger.info(`${logPrefix} Response enviado exitosamente`);
        } catch (error) {
            logger.error(`${logPrefix} Error:`, error);
            
            // Enviar RESPONSE con error
            await enviarMensaje({
                tipo: TIPOS_MENSAJE.DATOS.COORDENADAS_PARADAS_RESPONSE,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: mensaje.origen,
                datos: {
                    coordenadas: [],
                    total: 0,
                    exito: false,
                    error: error.message,
                    mensajeOriginal: mensaje.id
                }
            });
        }
    });

    /**
     * Controlador: DATOS.SOLICITAR_PARADA
     * Descripción: Busca y devuelve una parada específica por ID
     * Origen esperado: padre, hijo3, hijo4, hijo5-casa
     * Respuesta: DATOS.RESPUESTA_PARADA
     * 
     * Datos recibidos: { paradaId: string }
     * Datos enviados: { parada: Object|null, encontrada: boolean, exito: boolean, mensajeOriginal: string }
     * 
     * Ejemplo de uso:
     * await enviarMensaje({
     *     tipo: TIPOS_MENSAJE.DATOS.SOLICITAR_PARADA,
     *     origen: 'padre',
     *     destino: 'hijo2',
     *     datos: { paradaId: 'P-5' }
     * });
     */
    /**
     * Controlador: DATOS.SOLICITAR_PARADA
     * Descripción: Busca y devuelve una parada específica por ID con metadata opcional enriquecida
     * Origen esperado: padre, funciones-mapa.js, otros componentes
     * Respuesta: DATOS.RESPUESTA_PARADA
     * 
     * Datos recibidos: { 
     *     paradaId: string (requerido),
     *     incluirRutas?: boolean (default: false),
     *     incluirHorario?: boolean (default: false),
     *     incluirEstadisticas?: boolean (default: false),
     *     incluirMetadata?: boolean (default: true)
     * }
     * 
     * Datos enviados: { 
     *     parada: Object|null,
     *     paradaId: string,
     *     encontrada: boolean,
     *     exito: boolean,
     *     mensajeOriginal: string
     * }
     * 
     * Ejemplo de uso básico:
     * await enviarMensaje({
     *     tipo: TIPOS_MENSAJE.DATOS.SOLICITAR_PARADA,
     *     origen: 'padre',
     *     destino: 'hijo2',
     *     datos: { paradaId: 'P-5' }
     * });
     * 
     * Ejemplo de uso avanzado:
     * await enviarMensaje({
     *     tipo: TIPOS_MENSAJE.DATOS.SOLICITAR_PARADA,
     *     origen: 'padre',
     *     destino: 'hijo2',
     *     datos: { 
     *         paradaId: 'P-5',
     *         incluirRutas: true,
     *         incluirHorario: true,
     *         incluirEstadisticas: true
     *     }
     * });
     */
    registrarControlador(TIPOS_MENSAJE.DATOS.SOLICITAR_PARADA, async (mensaje) => {
        const logPrefix = `[hijo2][SOLICITAR_PARADA][${mensaje?.origen || 'desconocido'}]`;
        
        try {
            const { 
                paradaId,
                incluirRutas = false,
                incluirHorario = false,
                incluirEstadisticas = false,
                incluirMetadata = true
            } = mensaje.datos;
            
            // Validar parámetro requerido
            if (!paradaId) {
                throw new Error('Parámetro requerido: paradaId');
            }
            
            logger.debug(`${logPrefix} Buscando parada con ID: ${paradaId}`, {
                incluirRutas,
                incluirHorario,
                incluirEstadisticas
            });
            
            // Buscar parada en el array
            const paradaEncontrada = CoordenadasParadas.find(p => p.id === paradaId);
            
            if (!paradaEncontrada) {
                logger.warn(`${logPrefix} Parada ${paradaId} NO encontrada`);
                
                await enviarMensaje({
                    tipo: TIPOS_MENSAJE.DATOS.RESPUESTA_PARADA,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    destino: mensaje.origen,
                    datos: {
                        parada: null,
                        paradaId: paradaId,
                        encontrada: false,
                        exito: true,
                        mensajeOriginal: mensaje.id
                    }
                });
                return;
            }
            
            // Preparar respuesta básica
            const respuesta = {
                id: paradaEncontrada.id,
                nombre: paradaEncontrada.nombre,
                coordenadas: { ...paradaEncontrada.coordenadas }
            };
            
            // Agregar metadata si se solicita
            if (incluirMetadata) {
                respuesta.tipo = paradaEncontrada.tipo || 'parada';
                
                if (paradaEncontrada.audio) {
                    respuesta.audio = paradaEncontrada.audio;
                }
                
                if (paradaEncontrada.imagen) {
                    respuesta.imagen = paradaEncontrada.imagen;
                }
                
                if (paradaEncontrada.video) {
                    respuesta.video = paradaEncontrada.video;
                }
            }
            
            // Agregar rutas si se solicita (para tramos con waypoints)
            if (incluirRutas && paradaEncontrada.waypoints) {
                respuesta.rutas = {
                    waypoints: paradaEncontrada.waypoints,
                    totalWaypoints: paradaEncontrada.waypoints.length,
                    tipo: 'polyline'
                };
            }
            
            // Agregar horario si se solicita y existe
            if (incluirHorario && paradaEncontrada.horario) {
                respuesta.horario = paradaEncontrada.horario;
            }
            
            // Agregar estadísticas si se solicita
            if (incluirEstadisticas) {
                respuesta.estadisticas = {
                    tieneAudio: !!paradaEncontrada.audio,
                    tieneImagen: !!paradaEncontrada.imagen,
                    tieneVideo: !!paradaEncontrada.video,
                    tieneWaypoints: !!paradaEncontrada.waypoints,
                    numeroWaypoints: paradaEncontrada.waypoints?.length || 0,
                    tipo: paradaEncontrada.tipo || 'parada',
                    completitud: calcularCompleitud(paradaEncontrada)
                };
            }
            
            // Enviar RESPONSE con resultado enriquecido
            await enviarMensaje({
                tipo: TIPOS_MENSAJE.DATOS.RESPUESTA_PARADA,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: mensaje.origen,
                datos: {
                    parada: respuesta,
                    paradaId: paradaId,
                    encontrada: true,
                    exito: true,
                    mensajeOriginal: mensaje.id
                }
            });
            
            logger.info(`${logPrefix} Parada ${paradaId} encontrada: ${paradaEncontrada.nombre}`, {
                metadataIncluida: incluirMetadata,
                rutasIncluidas: incluirRutas && !!paradaEncontrada.waypoints,
                horarioIncluido: incluirHorario && !!paradaEncontrada.horario,
                estadisticasIncluidas: incluirEstadisticas
            });
            
        } catch (error) {
            logger.error(`${logPrefix} Error:`, error);
            
            // Enviar RESPONSE con error
            await enviarMensaje({
                tipo: TIPOS_MENSAJE.DATOS.RESPUESTA_PARADA,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: mensaje.origen,
                datos: {
                    parada: null,
                    encontrada: false,
                    exito: false,
                    error: error.message,
                    mensajeOriginal: mensaje.id
                }
            });
        }
    });
    
    /**
     * Función auxiliar para calcular completitud de una parada
     * @param {Object} parada - Objeto de parada
     * @returns {number} Porcentaje de completitud (0-100)
     */
    function calcularCompleitud(parada) {
        let puntos = 0;
        let total = 5;
        
        if (parada.nombre) puntos++;
        if (parada.coordenadas) puntos++;
        if (parada.audio) puntos++;
        if (parada.imagen || parada.video) puntos++;
        if (parada.waypoints && parada.waypoints.length > 0) puntos++;
        
        return Math.round((puntos / total) * 100);
    }

    /**
     * Controlador: DATOS.SOLICITAR_PARADAS
     * Descripción: Busca paradas cercanas a una coordenada geográfica usando la fórmula Haversine
     *              con filtros avanzados opcionales para búsqueda flexible
     * Origen esperado: padre (funciones-mapa.js), otros componentes
     * Respuesta: DATOS.RESPUESTA_PARADAS
     * 
     * Datos recibidos: { 
     *     lat: number (requerido),
     *     lng: number (requerido),
     *     radio?: number (default: 50 metros),
     *     filtro?: string (texto para buscar en nombre/ID),
     *     tipo?: 'parada'|'tramo' (filtrar por tipo),
     *     ordenPor?: 'distancia'|'nombre'|'id' (default: 'distancia'),
     *     orden?: 'asc'|'desc' (default: 'asc'),
     *     limite?: number (default: sin límite),
     *     incluirEstadisticas?: boolean (default: false),
     *     soloConAudio?: boolean (default: false),
     *     soloConImagen?: boolean (default: false),
     *     soloConVideo?: boolean (default: false)
     * }
     * 
     * Datos enviados: { 
     *     paradas: Array,
     *     total: number,
     *     radio: number,
     *     ubicacionBusqueda: {lat, lng},
     *     filtrosAplicados: Object,
     *     estadisticas?: Object,
     *     exito: boolean,
     *     mensajeOriginal: string
     * }
     * 
     * Cada parada incluye: { ...paradaOriginal, distancia: number (en metros) }
     * 
     * Ejemplo de uso básico:
     * await enviarMensaje({
     *     tipo: TIPOS_MENSAJE.DATOS.SOLICITAR_PARADAS,
     *     origen: 'padre',
     *     destino: 'hijo2',
     *     datos: { lat: 39.47876, lng: -0.37626, radio: 100 }
     * });
     * 
     * Ejemplo de uso avanzado:
     * await enviarMensaje({
     *     tipo: TIPOS_MENSAJE.DATOS.SOLICITAR_PARADAS,
     *     origen: 'padre',
     *     destino: 'hijo2',
     *     datos: { 
     *         lat: 39.47876, 
     *         lng: -0.37626, 
     *         radio: 200,
     *         filtro: 'Serranos',
     *         tipo: 'parada',
     *         ordenPor: 'nombre',
     *         limite: 10,
     *         incluirEstadisticas: true,
     *         soloConAudio: true
     *     }
     * });
     */
    registrarControlador(TIPOS_MENSAJE.DATOS.SOLICITAR_PARADAS, async (mensaje) => {
        const logPrefix = `[hijo2][SOLICITAR_PARADAS][${mensaje?.origen || 'desconocido'}]`;
        
        try {
            const { 
                lat, 
                lng, 
                radio = 50,
                filtro = null,
                tipo = null,
                ordenPor = 'distancia',
                orden = 'asc',
                limite = null,
                incluirEstadisticas = false,
                soloConAudio = false,
                soloConImagen = false,
                soloConVideo = false
            } = mensaje.datos;
            
            // Validar parámetros requeridos
            if (lat === undefined || lng === undefined) {
                throw new Error('Parámetros requeridos: lat, lng');
            }
            
            if (typeof lat !== 'number' || typeof lng !== 'number') {
                throw new Error('lat y lng deben ser números');
            }
            
            if (radio <= 0) {
                throw new Error('radio debe ser mayor a 0');
            }
            
            // Validar ordenPor
            const ordenesValidos = ['distancia', 'nombre', 'id'];
            if (!ordenesValidos.includes(ordenPor)) {
                throw new Error(`ordenPor debe ser uno de: ${ordenesValidos.join(', ')}`);
            }
            
            // Validar orden
            if (orden !== 'asc' && orden !== 'desc') {
                throw new Error("orden debe ser 'asc' o 'desc'");
            }
            
            logger.debug(`${logPrefix} Buscando paradas`, {
                lat, lng, radio,
                filtro: filtro || 'ninguno',
                tipo: tipo || 'todos',
                ordenPor,
                orden,
                limite: limite || 'sin límite'
            });
            
            /**
             * Función Haversine para calcular distancia en metros entre dos puntos geográficos
             * @param {number} lat1 - Latitud del punto 1
             * @param {number} lon1 - Longitud del punto 1
             * @param {number} lat2 - Latitud del punto 2
             * @param {number} lon2 - Longitud del punto 2
             * @returns {number} Distancia en metros
             */
            const calcularDistancia = (lat1, lon1, lat2, lon2) => {
                const R = 6371000; // Radio de la Tierra en metros
                const φ1 = lat1 * Math.PI / 180;
                const φ2 = lat2 * Math.PI / 180;
                const Δφ = (lat2 - lat1) * Math.PI / 180;
                const Δλ = (lon2 - lon1) * Math.PI / 180;
                
                const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                         Math.cos(φ1) * Math.cos(φ2) *
                         Math.sin(Δλ/2) * Math.sin(Δλ/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                
                return R * c; // Distancia en metros
            };
            
            // Filtrar paradas con coordenadas válidas y calcular distancias
            let paradasProcesadas = CoordenadasParadas
                .filter(parada => {
                    // Solo paradas con coordenadas definidas
                    return parada.coordenadas && 
                           parada.coordenadas.lat !== undefined && 
                           parada.coordenadas.lng !== undefined;
                })
                .map(parada => {
                    // Calcular distancia para cada parada
                    const distancia = calcularDistancia(
                        lat, lng,
                        parada.coordenadas.lat, parada.coordenadas.lng
                    );
                    return { ...parada, distancia };
                });
            
            // Aplicar filtro por radio
            paradasProcesadas = paradasProcesadas.filter(parada => parada.distancia <= radio);
            
            // Aplicar filtro de texto si se proporciona
            if (filtro && filtro.trim() !== '') {
                const terminoBusqueda = filtro.toLowerCase().trim();
                paradasProcesadas = paradasProcesadas.filter(parada => {
                    const nombre = (parada.nombre || '').toLowerCase();
                    const id = (parada.id || '').toLowerCase();
                    return nombre.includes(terminoBusqueda) || id.includes(terminoBusqueda);
                });
            }
            
            // Aplicar filtro por tipo si se proporciona
            if (tipo) {
                paradasProcesadas = paradasProcesadas.filter(parada => {
                    const tipoParada = parada.tipo || (parada.id?.startsWith('P-') ? 'parada' : 'tramo');
                    return tipoParada === tipo;
                });
            }
            
            // Aplicar filtros de contenido multimedia
            if (soloConAudio) {
                paradasProcesadas = paradasProcesadas.filter(parada => !!parada.audio);
            }
            
            if (soloConImagen) {
                paradasProcesadas = paradasProcesadas.filter(parada => !!parada.imagen);
            }
            
            if (soloConVideo) {
                paradasProcesadas = paradasProcesadas.filter(parada => !!parada.video);
            }
            
            // Ordenar según parámetros
            paradasProcesadas.sort((a, b) => {
                let valorA, valorB;
                
                switch (ordenPor) {
                    case 'distancia':
                        valorA = a.distancia;
                        valorB = b.distancia;
                        break;
                    case 'nombre':
                        valorA = (a.nombre || '').toLowerCase();
                        valorB = (b.nombre || '').toLowerCase();
                        break;
                    case 'id':
                        valorA = a.id || '';
                        valorB = b.id || '';
                        break;
                    default:
                        valorA = a.distancia;
                        valorB = b.distancia;
                }
                
                // Comparar valores
                let resultado = 0;
                if (typeof valorA === 'string' && typeof valorB === 'string') {
                    resultado = valorA.localeCompare(valorB);
                } else {
                    resultado = valorA > valorB ? 1 : valorA < valorB ? -1 : 0;
                }
                
                // Aplicar orden (asc/desc)
                return orden === 'desc' ? -resultado : resultado;
            });
            
            // Aplicar límite si se proporciona
            const totalSinLimite = paradasProcesadas.length;
            if (limite && limite > 0) {
                paradasProcesadas = paradasProcesadas.slice(0, limite);
            }
            
            // Preparar estadísticas si se solicitan
            let estadisticas = null;
            if (incluirEstadisticas) {
                estadisticas = {
                    totalEncontradas: totalSinLimite,
                    devueltas: paradasProcesadas.length,
                    conAudio: paradasProcesadas.filter(p => !!p.audio).length,
                    conImagen: paradasProcesadas.filter(p => !!p.imagen).length,
                    conVideo: paradasProcesadas.filter(p => !!p.video).length,
                    porTipo: {
                        paradas: paradasProcesadas.filter(p => {
                            const t = p.tipo || (p.id?.startsWith('P-') ? 'parada' : 'tramo');
                            return t === 'parada';
                        }).length,
                        tramos: paradasProcesadas.filter(p => {
                            const t = p.tipo || (p.id?.startsWith('P-') ? 'parada' : 'tramo');
                            return t === 'tramo';
                        }).length
                    },
                    distanciaPromedio: paradasProcesadas.length > 0 
                        ? Math.round(paradasProcesadas.reduce((sum, p) => sum + p.distancia, 0) / paradasProcesadas.length)
                        : 0,
                    distanciaMinima: paradasProcesadas.length > 0 
                        ? Math.round(Math.min(...paradasProcesadas.map(p => p.distancia)))
                        : 0,
                    distanciaMaxima: paradasProcesadas.length > 0 
                        ? Math.round(Math.max(...paradasProcesadas.map(p => p.distancia)))
                        : 0
                };
            }
            
            // Preparar objeto de filtros aplicados
            const filtrosAplicados = {
                radio,
                filtroTexto: filtro || null,
                tipo: tipo || null,
                ordenPor,
                orden,
                limite: limite || null,
                soloConAudio,
                soloConImagen,
                soloConVideo
            };
            
            // Enviar RESPONSE con paradas encontradas
            await enviarMensaje({
                tipo: TIPOS_MENSAJE.DATOS.RESPUESTA_PARADAS,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: mensaje.origen,
                datos: {
                    paradas: paradasProcesadas,
                    total: paradasProcesadas.length,
                    totalSinLimite,
                    radio: radio,
                    ubicacionBusqueda: { lat, lng },
                    filtrosAplicados,
                    estadisticas,
                    exito: true,
                    mensajeOriginal: mensaje.id
                }
            });
            
            if (paradasProcesadas.length > 0) {
                const masProxima = paradasProcesadas[0];
                logger.info(`${logPrefix} ${paradasProcesadas.length} paradas encontradas (${totalSinLimite} antes de límite)`, {
                    masProxima: masProxima.nombre,
                    distancia: `${Math.round(masProxima.distancia)}m`,
                    filtrosAplicados: Object.keys(filtrosAplicados).filter(k => filtrosAplicados[k] !== null && filtrosAplicados[k] !== false).length
                });
            } else {
                logger.warn(`${logPrefix} No se encontraron paradas con los filtros aplicados`, filtrosAplicados);
            }
        } catch (error) {
            logger.error(`${logPrefix} Error:`, error);
            
            // Enviar RESPONSE con error
            await enviarMensaje({
                tipo: TIPOS_MENSAJE.DATOS.RESPUESTA_PARADAS,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: mensaje.origen,
                datos: {
                    paradas: [],
                    total: 0,
                    exito: false,
                    error: error.message,
                    mensajeOriginal: mensaje.id
                }
            });
        }
    });

    // ==================== CONTROLADORES DE NAVEGACIÓN ====================
    
    /**
     * Controlador: NAVEGACION.CAMBIO_PARADA
     * Descripción: Actualiza la parada actual en el estado interno de hijo2
     * Origen esperado: padre
     * Respuesta: No requiere (notificación unidireccional)
     * 
     * Datos recibidos: { paradaId: string, parada: number|string, nombre?: string }
     * 
     * Nota: Este controlador mantiene sincronizado el estado de hijo2 con la parada
     * actual del sistema, permitiendo que los botones envíen contexto correcto
     */
    registrarControlador(TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA, async (mensaje) => {
        const logPrefix = `[hijo2][CAMBIO_PARADA][${mensaje?.origen || 'desconocido'}]`;
        
        try {
            const { paradaId, parada, nombre } = mensaje.datos;
            
            logger.debug(`${logPrefix} Recibido:`, { paradaId, parada, nombre });
            
            // Actualizar estado interno
            estadoComponente.paradaActual = parada;
            
            // Actualizar UI con información de la parada
            const textoParada = nombre || `Parada ${parada || paradaId}`;
            actualizarEstado(textoParada, 'info');
            
            logger.info(`${logPrefix} Parada actual actualizada: ${textoParada}`);
        } catch (error) {
            logger.error(`${logPrefix} Error:`, error);
            actualizarEstado('Error actualizando parada', 'error');
        }
    });

    /**
     * Controlador: SISTEMA.HEARTBEAT
     * Descripción: Responde a pings de monitoreo del padre para verificar que el componente está activo
     * Origen esperado: padre (monitoreo.js)
     * Respuesta: SISTEMA.HEARTBEAT_RESPONSE
     * 
     * Datos recibidos: { timestamp: number }
     * Datos enviados: { timestamp: number, estado: string, gpsActivo: boolean, paradaActual: any }
     * 
     * Nota: Incluye información del estado interno para diagnóstico
     */
    registrarControlador(TIPOS_MENSAJE.SISTEMA.HEARTBEAT, (mensaje) => {
        const logPrefix = `[hijo2][HEARTBEAT][${mensaje?.origen || 'desconocido'}]`;
        
        try {
            // Responder inmediatamente con estado actual
            enviarMensaje({
                destino: mensaje.origen,
                tipo: TIPOS_MENSAJE.SISTEMA.HEARTBEAT_RESPONSE,
                origen: CONFIG_HIJO.IFRAME_ID,
                datos: { 
                    timestamp: Date.now(),
                    estado: estadoComponente.inicializado ? 'activo' : 'inicializando',
                    gpsActivo: estadoComponente.gpsActivo,
                    paradaActual: estadoComponente.paradaActual,
                    coordenadasCargadas: CoordenadasParadas.length
                }
            });
            
            logger.debug(`${logPrefix} Heartbeat respondido - Estado: ${estadoComponente.inicializado ? 'activo' : 'inicializando'}`);
        } catch (error) {
            logger.error(`${logPrefix} Error respondiendo heartbeat:`, error);
        }
    });

    // Controlador para respuesta de datos de paradas del padre
    registrarControlador(TIPOS_MENSAJE.NAVEGACION.RESPUESTA_DATOS_PARADAS, async (mensaje) => {
        const logPrefix = `[hijo2][NAVEGACION.RESPUESTA_DATOS_PARADAS][${mensaje?.origen || 'desconocido'}]`;
        
        try {
            // Evitar procesamiento duplicado
            if (estadoComponente.datosRecibidos) {
                logger.debug(`${logPrefix} Datos ya recibidos anteriormente, ignorando mensaje duplicado`);
                return;
            }
            
            logger.debug(`${logPrefix} Respuesta de paradas recibida`);
            
            // Validación de datos
            if (!mensaje.datos || !mensaje.datos.paradas || !Array.isArray(mensaje.datos.paradas)) {
                logger.error(`${logPrefix} Datos de paradas inválidos`, mensaje.datos);
                return;
            }
            
            // Almacenar datos localmente
            estadoComponente.arrayParadasLocal = mensaje.datos.paradas;
            estadoComponente.datosRecibidos = true;
            
            logger.info(`${logPrefix} Datos de paradas almacenados localmente: ${estadoComponente.arrayParadasLocal.length} paradas`);
            
            // Confirmar recepción al padre
            await enviarMensaje({
                destino: 'padre',
                tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION,
                origen: CONFIG_HIJO.IFRAME_ID,
                datos: {
                    mensajeOriginalId: mensaje.id,
                    tipoConfirmacion: 'DATOS_RECIBIDOS',
                    totalParadas: estadoComponente.arrayParadasLocal.length
                }
            });
            
        } catch (error) {
            logger.error(`${logPrefix} Error al procesar respuesta de datos de paradas:`, error);
        }
    });

    // Controlador para solicitud de coordenadas del padre
    registrarControlador(TIPOS_MENSAJE.NAVEGACION.SOLICITAR_COORDENADAS, async (mensaje) => {
        const logPrefix = `[hijo2][NAVEGACION.SOLICITAR_COORDENADAS][${mensaje?.origen || 'desconocido'}]`;
        
        try {
            const { paradaId, tipoConsulta } = mensaje.datos;
            
            // Validar datos requeridos
            if (!paradaId) {
                logger.error(`${logPrefix} paradaId requerido faltante`);
                return;
            }
            if (!tipoConsulta) {
                logger.error(`${logPrefix} tipoConsulta requerido faltante`);
                return;
            }
            if (tipoConsulta !== 'COORDENADAS') {
                logger.error(`${logPrefix} tipoConsulta inválido: ${tipoConsulta}, esperado: COORDENADAS`);
                return;
            }
            
            logger.debug(`${logPrefix} Solicitud de coordenadas para ${paradaId}`);
            
            // Buscar coordenadas en array local
            const coordenadas = estadoComponente.arrayParadasLocal?.find(p => p.padreid === paradaId);
            
            if (!coordenadas) {
                logger.warn(`${logPrefix} Coordenadas no encontradas para ${paradaId}`);
                return;
            }
            
            // Validar que las coordenadas sean válidas
            if (!coordenadas.lat || !coordenadas.lng) {
                logger.error(`${logPrefix} Coordenadas inválidas para ${paradaId}: lat=${coordenadas.lat}, lng=${coordenadas.lng}`);
                return;
            }
            
            // Responder al padre
            await enviarMensaje({
                destino: 'padre',
                tipo: TIPOS_MENSAJE.NAVEGACION.RESPUESTA_COORDENADAS,
                origen: CONFIG_HIJO.IFRAME_ID,
                datos: {
                    paradaId,
                    lat: coordenadas.lat,
                    lng: coordenadas.lng,
                    nombre: coordenadas.nombre,
                    tipo: coordenadas.tipo
                }
            });
            
            logger.info(`${logPrefix} Coordenadas enviadas para ${paradaId}`);
            
        } catch (error) {
            logger.error(`${logPrefix} Error respondiendo coordenadas:`, error);
        }
    });

    // Controlador para ACK del sistema
    registrarControlador(TIPOS_MENSAJE.SISTEMA.ACK, async (mensaje) => {
        const logPrefix = `[hijo2][SISTEMA.ACK][${mensaje?.origen || 'desconocido'}]`;
        
        try {
            logger.debug(`${logPrefix} ACK recibido, respondiendo...`);
            
            // Responder al ACK
            await enviarMensaje({
                destino: 'padre',
                tipo: TIPOS_MENSAJE.SISTEMA.ACK,
                origen: CONFIG_HIJO.IFRAME_ID,
                datos: {
                    componenteId: CONFIG_HIJO.COMPONENTE_ID,
                    timestamp: Date.now(),
                    estado: 'activo'
                }
            });
            
            logger.debug(`${logPrefix} ACK respondido`);
            
        } catch (error) {
            logger.error(`${logPrefix} Error respondiendo ACK:`, error);
        }
    });

    // Notificar al padre que hijo2 está listo
    await enviarMensaje({
        destino: 'padre',
        tipo: TIPOS_MENSAJE.SISTEMA.HIJO_LISTO,
        origen: CONFIG_HIJO.IFRAME_ID,
        datos: { 
            componenteId: CONFIG_HIJO.COMPONENTE_ID,
            coordenadasDisponibles: CoordenadasParadas.length
        }
    });

    estadoComponente.inicializado = true;
    actualizarEstado('Listo', 'success');
    logger.info(`[hijo2] Inicialización completada exitosamente`);
    
} catch (error) {
    logger.error(`[hijo2] Error durante la inicialización:`, error);
    actualizarEstado('Error de inicialización', 'error');
    
    try {
        await enviarMensaje({
            destino: 'padre',
            tipo: TIPOS_MENSAJE.SISTEMA.ERROR,
            origen: CONFIG_HIJO.IFRAME_ID,
            datos: { 
                error: error.message,
                componente: CONFIG_HIJO.COMPONENTE_ID
            }
        });
    } catch (notifyError) {
        logger.error(`[hijo2] Error notificando fallo:`, notifyError);
    }
}

// Implementar pagehide para limpiar recursos
window.addEventListener('pagehide', () => {
    logger.info(`[hijo2] Limpiando recursos en pagehide`);
    estadoComponente.inicializado = false;
});
    </script>
