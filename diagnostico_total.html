<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico Total - Sistema PROM</title>
<style>
body{font-family:system-ui;background:#f5f9f6;margin:0;padding:1rem;color:#222;}
h1{color:#00695c;}
section{margin-bottom:2rem;padding:1rem;border-radius:8px;}
.ok{background:#e8f7e8;border-left:6px solid #2e8b57;}
.warn{background:#fff9e6;border-left:6px solid #e6b800;}
.err{background:#ffe5e5;border-left:6px solid #c00;}
button{background:#007bff;color:white;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;}
button:hover{background:#005fcc;}
</style>
</head>
<body>

<h1>🧩 Diagnóstico Total - Sistema PROM</h1>

<section id="js" class="warn">
  <h2>📦 Módulos JavaScript</h2>
  <ul id="js-results"></ul>
  <button onclick="comprobarJS()">Comprobar JS</button>
</section>

<section id="carpetas" class="warn">
  <h2>🗂️ Estructura del Proyecto</h2>
  <ul id="folders-results"></ul>
  <button onclick="comprobarCarpetas()">Comprobar carpetas</button>
</section>

<section id="config" class="warn">
  <h2>📘 Archivos de Configuración</h2>
  <ul id="config-results"></ul>
  <button onclick="comprobarConfig()">Comprobar configuración</button>
</section>

<script>
const basePath = (()=>{
  // Detecta si se está ejecutando local (file://) o remoto
  if (location.protocol === 'file:') {
    return './';  // entorno local o VS Code
  } else {
    const url = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/');
    return url;
  }
})();

const jsFiles = [
  'constants.js','logger.js','config.js','utils.js',
  'funciones-mapa.js','eventos-usuario.js'
];

async function comprobarJS() {
  const ul = document.getElementById('js-results');
  ul.innerHTML = '';
  let errores = 0;

  for (const file of jsFiles) {
    const li = document.createElement('li');
    try {
      const path = `${basePath}js/${file}`;
      const r = await fetch(path, {cache:'no-store'});
      if (!r.ok) throw new Error();
      li.textContent = `✅ ${file} accesible`;
      li.style.color = 'green';
    } catch {
      li.textContent = `⚠️ ${file} no encontrado o inaccesible (${basePath}js/${file})`;
      li.style.color = 'orange';
      errores++;
    }
    ul.appendChild(li);
  }
  document.getElementById('js').className = errores ? 'warn' : 'ok';
}

function comprobarCarpetas() {
  const expected = ['src/','data/','outputs/','logs/','tests/'];
  const ul = document.getElementById('folders-results');
  ul.innerHTML = '';
  let errores = 0;

  expected.forEach(folder=>{
    const li=document.createElement('li');
    li.textContent = `⚠️ Carpeta '${folder}' no encontrada (verifica estructura)`;
    li.style.color='orange';
    ul.appendChild(li);
    errores++;
  });

  document.getElementById('carpetas').className = errores ? 'warn' : 'ok';
}

function comprobarConfig() {
  const files = ['README.md','requirements.txt','env_example.txt','.env'];
  const ul = document.getElementById('config-results');
  ul.innerHTML = '';
  let errores = 0;

  files.forEach(file=>{
    const li=document.createElement('li');
    const path=`${basePath}${file}`;
    fetch(path,{cache:'no-store'}).then(r=>{
      if(r.ok){
        li.textContent=`✅ ${file} disponible`;
        li.style.color='green';
      } else {
        li.textContent=`⚠️ ${file} no localizado`;
        li.style.color='orange';
        errores++;
      }
      ul.appendChild(li);
    }).catch(()=>{
      li.textContent=`⚠️ ${file} no localizado`;
      li.style.color='orange';
      ul.appendChild(li);
      errores++;
    });
  });

  setTimeout(()=>{document.getElementById('config').className = errores ? 'warn' : 'ok';},1000);
}
</script>

</body>
</html>
