    /* Función: fuegosArtificiales()
       Muestra una animación de fuegos artificiales en la pantalla.
    */
    function fuegosArtificiales() {
        if (!fuegosDiv) {
            return;
        }
        fuegosDiv.innerHTML = ""; // Limpiar fuegos anteriores
        fuegosDiv.style.display = "block"; // Mostrar el contenedor de fuegos

        const NUM_CHISPAS_POR_FUEGO = 30;
        const NUM_EXPLOSIONES = 15;

        for (let e = 0; e < NUM_EXPLOSIONES; e++) {
            const delayExplosion = (DURACION_TOTAL_MS / NUM_EXPLOSIONES) * e;

            setTimeout(() => {
                const containerWidth = fuegosDiv.offsetWidth || window.innerWidth;
                const containerHeight = fuegosDiv.offsetHeight || window.innerHeight;

                const startX = Math.random() * containerWidth;
                const startY = Math.random() * containerHeight;

                for (let i = 0; i < NUM_CHISPAS_POR_FUEGO; i++) {
                    let chispa = document.createElement("div");
                    chispa.style.position = "absolute";
                    chispa.style.borderRadius = "50%";
                    chispa.style.width = "12px";
                    chispa.style.height = "12px";
                    chispa.style.background = `hsl(${Math.random() * 360}, 100%, 70%)`;
                    chispa.style.opacity = "1";
                    chispa.style.left = `${startX}px`;
                    chispa.style.top = `${startY}px`;
                    chispa.style.zIndex = "10";

                    fuegosDiv.appendChild(chispa);

                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 80 + 40;
                    const endX = startX + distance * Math.cos(angle);
                    const endY = startY + distance * Math.sin(angle);

                    const chispaDuration = DURACION_TOTAL_MS / NUM_EXPLOSIONES * 1.5;

                    chispa.offsetWidth; // Forzar reflow para asegurar que la transición se aplique
                    chispa.style.transition = `all ${chispaDuration}ms ease-out`;
                    chispa.style.left = `${endX}px`;
                    chispa.style.top = `${endY}px`;
                    chispa.style.opacity = "0";
                    chispa.style.transform = "scale(0.5)";

                    setTimeout(() => {
                        if (chispa.parentNode) {
                            chispa.parentNode.removeChild(chispa);
                        }
                    }, chispaDuration + 50);
                }
            }, delayExplosion);
        }
        setTimeout(() => {
            fuegosDiv.style.display = "none";
        }, DURACION_TOTAL_MS + 100);
    }

            fuegosDiv.style.display = "none";

            retoDiv.innerHTML = ""; // Limpiar contenido anterior del reto
            retoDiv.setAttribute("tabindex", "0");
            retoDiv.classList.remove('puzzle-active'); // Remover la clase puzzle-active

            let preguntaElem = document.createElement("h3");
            preguntaElem.textContent = `${reto.pregunta}`;
            retoDiv.appendChild(preguntaElem);

            if (reto.tipo === "opcion" || reto.tipo === "opcion-multiple") {
                const inputType = reto.multiple ? "checkbox" : "radio";
                reto.opciones.forEach((opcion, i) => {
                    const divOpcion = document.createElement("div");
                    divOpcion.className = "respuesta";
                    const input = document.createElement("input");
                    input.type = inputType;
                    input.name = "op";
                    input.value = opcion;
                    input.id = "opcion" + i;
                    divOpcion.appendChild(input);

                    const label = document.createElement("label");
                    label.htmlFor = input.id;
                    label.textContent = opcion;
                    divOpcion.appendChild(label);
                    retoDiv.appendChild(divOpcion);
                });
                // Insertar btnEnviar en el button-container para mantener estilos consistentes
                const buttonContainer = document.getElementById('button-container');
                if (buttonContainer && !buttonContainer.contains(btnEnviar)) {
                    buttonContainer.insertBefore(btnEnviar, buttonContainer.firstChild);
                }
                btnEnviar.style.display = "inline-block"; // Mostrar el botón Enviar
                btnEnviar.disabled = false;
            }
            else if (reto.tipo === "texto") {
                const inputTexto = document.createElement("input");
                inputTexto.type = "text";
                inputTexto.id = "respuestaTexto";
                inputTexto.autocomplete = "off";
                inputTexto.spellcheck = false;
                inputTexto.setAttribute("inputmode", "text");
                inputTexto.style.fontSize = "1.2em";
                inputTexto.style.width = "100%";
                inputTexto.placeholder = "Escriba su respuesta aquí...";
                retoDiv.appendChild(inputTexto);
                // Insertar btnEnviar en el button-container para mantener estilos consistentes
                const buttonContainer = document.getElementById('button-container');
                if (buttonContainer && !buttonContainer.contains(btnEnviar)) {
                    buttonContainer.insertBefore(btnEnviar, buttonContainer.firstChild);
                }
                btnEnviar.style.display = "inline-block"; // Mostrar el botón Enviar
                btnEnviar.disabled = false;
                setTimeout(() => inputTexto.focus(), 200);
            }
            else if (reto.tipo === "puzzle") {
                retoDiv.classList.add('puzzle-active');
                const puzzleIframe = document.createElement("iframe");
                puzzleIframe.id = "puzzleIframe";
                puzzleIframe.src = reto.src;
                puzzleIframe.frameBorder = "0";
                puzzleIframe.allowFullscreen = true;
                retoDiv.appendChild(puzzleIframe);

                // Ocultar botones de la página principal para puzzles, ya que el puzzle gestiona su propia lógica.
                ocultarControles();
            }
        }

        /* Función: verificar()
           Comprueba si la respuesta del usuario para el reto actual es correcta.
        */
        function verificar() {
            const reto = retoActual;
            if (!reto) return;

            btnEnviar.disabled = true; // Desactivar el botón Enviar
            divRespuestaCorrecta.style.display = "none";
            divRespuestaCorrecta.textContent = "";
            retoDiv.classList.remove("correct", "incorrect");
            fuegosDiv.innerHTML = "";
            fuegosDiv.style.display = "none";

            let esCorrecto = false;

            // Ejecutar validación personalizada primero
            let respuestaUsuario = null;
            try {
                // Obtener la respuesta del usuario según el tipo de reto
                if (reto.tipo === "opcion") {
                    const seleccion = document.querySelector('input[name="op"]:checked');
                    respuestaUsuario = seleccion ? seleccion.value : null;
                } else if (reto.tipo === "opcion-multiple") {
                    respuestaUsuario = Array.from(document.querySelectorAll('input[name="op"]:checked')).map(i => i.value);
                } else if (reto.tipo === "texto") {
                    // Para retos de texto, la respuesta se obtiene del input correspondiente
                    const inputTexto = document.querySelector('input[type="text"], textarea');
                    respuestaUsuario = inputTexto ? inputTexto.value : null;
                }

                // Llamar a la validación personalizada
                const validacionPersonalizada = window.ejecutarValidacion(reto, respuestaUsuario);
                if (validacionPersonalizada === false) {
                    console.warn(`[hijo4] Validación personalizada falló para reto ${reto?.id || 'desconocido'}`);
                    throw new Error("Validación personalizada falló");
                }
            } catch (error) {
                console.error(`[hijo4] Error en window.ejecutarValidacion para reto ${reto?.id || 'desconocido'}:`, error.message);
                // Si la validación personalizada falla, mostrar error y permitir reintentar
                alert("Error en la validación: " + error.message);
                btnEnviar.disabled = false;
                return;
            }

            if (reto.tipo === "opcion") {
                const seleccion = document.querySelector('input[name="op"]:checked');
                if (!seleccion) {
                    alert("Por favor, seleccione una opción.");
                    btnEnviar.disabled = false;
                    return;
                }
                esCorrecto = reto.correctas.includes(seleccion.value);
            } else if (reto.tipo === "opcion-multiple") {
                const checks = Array.from(document.querySelectorAll('input[name="op"]:checked')).map(i => i.value);
                if (checks.length === 0) {
                    alert("Por favor, seleccione al menos una opción.");
                    btnEnviar.disabled = false;
                    return;
                }
                esCorrecto = reto.correctas.every(c => checks.includes(c)) && checks.every(s => reto.correctas.includes(s));
            } else if (reto.tipo === "texto") {
                // Se establece como correcto por defecto para retos de texto libre.
                esCorrecto = true;
            }

            if (esCorrecto) {
                retoDiv.classList.add("correct");
                fuegosArtificiales(); // Llama a la animación

                // Habilitar btnNext después de una respuesta correcta
                if (btnNext) btnNext.disabled = false;

                ocultarControles(); // Ocultar todos los controles (incluye btnEnviar)

                // Enviar mensaje al padre indicando que el reto se completó
                // Actualizar estado de progreso
                estadoRetos.retosCompletados.add(reto.id);
                estadoRetos.progreso.completados = estadoRetos.retosCompletados.size;
                estadoRetos.ultimoReto = reto.id;
                estadoRetos.estadisticas.aciertosConsecutivos++;
                
                logger.info(`[hijo4] Reto completado: ${reto.id}. Progreso: ${estadoRetos.progreso.completados}/${estadoRetos.progreso.total}`);

                enviarMensaje({
                    tipo: TIPOS_MENSAJE.RETO.COMPLETADO,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    destino: getPadreId(),
                    datos: {
                        retoId: reto.id,
                        correcto: true,
                        progreso: estadoRetos.progreso
                    }
                });
            } else {
                retoDiv.classList.add("incorrect");
                vibrar();
                btnEnviar.disabled = false; // Permitir reintentar
            }
        }

        /* Event Listener: btnMostrarRespuesta
           Muestra la respuesta correcta del reto actual.
        */
        btnMostrarRespuesta.addEventListener("click", () => {
            const reto = retoActual;
            if (!reto) return; // Verificar que retoActual existe
            if (reto.tipo === "opcion" || reto.tipo === "opcion-multiple" || reto.tipo === "texto") {
                divRespuestaCorrecta.textContent = "Respuesta correcta: " + ((reto.correctas || []).join(", "));
            } else {
                divRespuestaCorrecta.textContent = "No hay respuesta correcta disponible para este tipo de reto.";
            }
            divRespuestaCorrecta.style.display = "block";
        });

        /* Event Listener: btnNext
           Envía mensaje al padre para cerrar la ventana del reto.
        */
        if (btnNext) {
            btnNext.addEventListener("click", () => {
            // Enviar mensaje al padre para cerrar la ventana
            enviarMensaje({
                tipo: TIPOS_MENSAJE.RETO.OCULTAR,
                origen: CONFIG_HIJO.IFRAME_ID,
                destino: getPadreId(),
                datos: {
                    retoId: retoActual ? retoActual.id : null
                }
            });
            });
        }

        /* Event Listener: btnEnviar
           Activa la verificación de la respuesta del usuario.
        */
        if (btnEnviar) {
            btnEnviar.addEventListener("click", verificar);
        }

        /* Event Listener: window.message
           Escucha mensajes provenientes del iframe del puzzle para coordinar el avance.
        */
        window.addEventListener("message", (event) => {
            // En un entorno de producción, es MUY RECOMENDABLE verificar event.origin para seguridad
            // if (event.origin !== "https://valenciavguides.github.io") return; // Reemplaza con tu dominio

            // Asegúrate de que el mensaje provenga del iframe del puzzle
            if (event.source !== window.frames[0]) {
                return;
            }

            if (event.data === "puzzle-state-completed") {
                retoDiv.classList.add("correct");
                retoDiv.classList.remove("incorrect");
                fuegosArtificiales();
                // Enviar mensaje de completado para puzzles
                enviarMensaje({
                    tipo: TIPOS_MENSAJE.RETO.COMPLETADO,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    destino: getPadreId(),
                    datos: {
                        retoId: retoActual.id,
                        completado: true
                    }
                });
                if (btnNext) btnNext.disabled = false;
            }
            else if (event.data === "puzzle-state-timeout") {
                retoDiv.classList.add("incorrect");
                retoDiv.classList.remove("correct");
                vibrar();
                // El puzzle gestiona su propio comportamiento de timeout, no se activan aquí.
            }
            else if (event.data === "advance-to-next") {
                divRespuestaCorrecta.style.display = "none";
                indiceReto++;
                if (indiceReto >= retosAventura1Es.length) {
                    alert("¡Has terminado todos los retos de la Aventura 1!");
                    indiceReto = 0; // Opcional: Reiniciar o redirigir
                }
                const siguiente = retosAventura1Es[indiceReto];
                if (siguiente) {
                    mostrarReto(siguiente.id);
                } else {
                    logger.warn('[hijo4] No hay siguiente reto para índice', indiceReto);
                }
            }
        });

        /* Función: normalizarModo(modo)
           Acepta string u objeto y devuelve una cadena segura para usos en clases/dataset
        */
        function normalizarModo(modo) {
            try {
                if (typeof modo === 'string') {
                    modo = modo.trim();
                } else if (modo && typeof modo === 'object') {
                    modo = modo.actual || modo.modo || modo.nombre || Object.values(modo).find(v => typeof v === 'string') || '';
                } else if (modo === null || typeof modo === 'undefined') {
                    modo = '';
                } else {
                    modo = String(modo);
                }
                modo = String(modo || '').trim().toLowerCase();
                modo = modo.replace(/[^a-z0-9_-]/g, '-').replace(/^-+|-+$/g, '');
                return modo;
            } catch (e) {
                return '';
            }
        }

        /* Función: actualizarInterfazModo(modo)
           Actualiza la interfaz según el modo (aventura/casa)
        */
        function actualizarInterfazModo(modo) {
            const modoSeguro = normalizarModo(modo);
            console.log(`[RETOS] Actualizando interfaz para modo:`, { original: modo, normalizado: modoSeguro });
            const body = document.body;

            // Actualizar estado local
            estado.modoActual = modoSeguro || modo;

            // Actualizar clases CSS
            body.classList.remove('modo-casa', 'modo-aventura');
            if (modoSeguro) body.classList.add(`modo-${modoSeguro}`);

            // Ajustes específicos según el modo
            const retoContainer = document.getElementById('reto-container');
            if (retoContainer) {
                if (modoSeguro) retoContainer.dataset.modo = modoSeguro;

                // Ajustar estilos según el modo
                if (modoSeguro === 'casa') {
                    retoContainer.style.borderColor = '#3498db'; // Azul para modo casa
                } else if (modoSeguro) {
                    retoContainer.style.borderColor = '#e67e22'; // Naranja para modo aventura u otros
                }
            }

            // Si hay un reto abierto, actualizar su visualización
            if (estado.retoActualId) {
                console.log(`[RETOS] Se está mostrando el reto ${estado.retoActualId} en modo ${modoSeguro || modo}`);
            }
        }

        // Inicializar mensajería y controladores
        try {
            // Ocultar la UI hasta que el padre confirme que los controladores están listos
            let _uiConfirmado = false;
            const _originalDisplay = (document.body && document.body.style && document.body.style.display) || '';
            try { if (document.body) document.body.style.display = 'none'; } catch (e) { /* ignore */ }
            function mostrarUI() { if (!_uiConfirmado) { console.warn('[hijo4] mostrarUI ignorado: esperando PADRE_CONFIRMA_HIJO_LISTO'); return; } try { if (document.body) document.body.style.display = _originalDisplay || 'block'; console.log('[hijo4] UI visible tras PADRE_CONFIRMA_HIJO_LISTO'); } catch (e) {} }

            // Inicializar mensajería con estructura correcta para hijo4
            await inicializarMensajeria({
                iframeId: window.frameElement.id,
                debug: CONFIG_HIJO.DEBUG
            });

            // Aplazar envío de HIJO_LISTO hasta registrar controladores críticos
            logger.debug('[hijo4] HIJO_LISTO aplazado hasta post-inicialización de controladores');

            logger.info(`Hijo ${CONFIG_HIJO.IFRAME_ID} registrado el controlador PADRE_LISTO`);
            // Controlador para inicialización del padre
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_LISTO, async (mensaje) => {
                logger.info(`[hijo4] PADRE_LISTO recibido desde ${mensaje.origen}`);
                logger.info(`Hijo ${CONFIG_HIJO.IFRAME_ID} recibió PADRE_LISTO`);

                // ✅ PROCESAR DATOS INICIALES DEL PADRE
                if (mensaje.datos) {
                    const { modo, paradas, paradaActual } = mensaje.datos;

                    if (modo) {
                        logger.info(`[hijo4] Procesando modo inicial del padre: ${modo}`);
                        actualizarInterfazModo(modo);
                    }

                    if (paradas) {
                        logger.debug(`[hijo4] Paradas recibidas: ${paradas.length}`);
                    }

                    if (paradaActual) {
                        logger.debug(`[hijo4] Parada actual: ${paradaActual}`);
                    }
                }

                // Enviar HIJO_LISTO directamente
                logger.info(`Hijo ${CONFIG_HIJO.IFRAME_ID} enviando HIJO_LISTO`);
                await enviarMensaje({
                    destino: getPadreId(),
                    tipo: TIPOS_MENSAJE.SISTEMA.HIJO_LISTO,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: {
                        version: '1.0.0',
                        capacidades: ['retos', 'preguntas', 'validacion'],
                        timestamp: Date.now()
                    }
                });
                logger.info(`[hijo4] HIJO_LISTO enviado al padre`);
            });

            // Controlador para confirmación del padre
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.PADRE_CONFIRMA_HIJO_LISTO, async (mensaje) => {
                console.log('[hijo4] PADRE_CONFIRMA_HIJO_LISTO recibido:', mensaje);
                logger.info(`[hijo4] PADRE_CONFIRMA_HIJO_LISTO recibido desde ${mensaje.origen}`);

                // Aplicar modo pendiente si estaba encolado
                try {
                    if (estado.pendingCambioModo && estado.pendingCambioModo.modo) {
                        const modoPendiente = estado.pendingCambioModo.modo;
                        logger.info(`[hijo4] Aplicando modo pendiente: ${modoPendiente}`);
                        actualizarInterfazModo(modoPendiente);
                        await enviarMensaje({
                            destino: mensaje.origen,
                            tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION,
                            origen: CONFIG_HIJO.IFRAME_ID,
                            datos: { tipo: 'inicializacion', modo: modoPendiente }
                        });
                        delete estado.pendingCambioModo;
                    }
                } catch (err) {
                    logger.error('[hijo4] Error aplicando modo pendiente:', err);
                }

                // 🔥 NUEVO: Procesar modo inicial si viene en datos
                const { modoInicial } = mensaje.datos || {};
                if (modoInicial) {
                    logger.info(`[hijo4] Modo inicial recibido: ${modoInicial}`);
                    actualizarInterfazModo(modoInicial);
                    logger.debug(`[hijo4] Interfaz actualizada según modo inicial`);
                }

                // Mostrar UI ahora que el padre confirmó
                try { _uiConfirmado = true; mostrarUI(); } catch (e) { /* ignore */ }
                try { await enviarMensaje({ destino: getPadreId(), tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION, origen: CONFIG_HIJO.IFRAME_ID, datos: { tipo: 'UI_VISIBLE', timestamp: Date.now() } }); } catch (e) { /* ignore */ }
            });

            // Controlador para mostrar reto específico
            registrarControladorSeguro(TIPOS_MENSAJE.RETO.MOSTRAR, (mensaje) => {
                const { retoId } = mensaje.datos;
                logger.info(`[hijo4] RETO.MOSTRAR recibido para reto: ${retoId}`);
                console.log(`[hijo4] Mensaje RETO.MOSTRAR completo:`, mensaje);
                mostrarReto(retoId);
                estado.retoActualId = retoId;
            });

            // Controlador para cambio de modo - Protocolo bidireccional
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO, async (mensaje) => {
                const logPrefix = `[hijo4][CAMBIO_MODO]`;

                try {
                    // Validar carga secuencial
                    if (!mensaje.datos?.secuenciaCompleta) {
                        logger.warn(`${logPrefix} Mensaje recibido antes de secuencia completa`);
                        estado.pendingCambioModo = mensaje.datos || { modo: null };
                        await enviarMensaje({
                            tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                            origen: CONFIG_HIJO.IFRAME_ID,
                            destino: mensaje.origen,
                            datos: {
                                error: 'Secuencia no completa',
                                esperarPermiso: true,
                                tipoOriginal: mensaje.tipo,
                                modoSolicitado: mensaje.datos?.modo
                            }
                        });
                        return;
                    }

                    // Extraer y validar datos
                    const { modo } = mensaje.datos || {};
                    if (!modo || !['casa', 'aventura'].includes(modo)) {
                        logger.error(`${logPrefix} Modo inválido: ${modo}`);
                        await enviarMensaje({
                            tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                            origen: CONFIG_HIJO.IFRAME_ID,
                            destino: mensaje.origen,
                            datos: { error: 'Modo inválido', modoRecibido: modo }
                        });
                        return;
                    }

                    // Enviar ENTENDIDO
                    logger.info(`${logPrefix} Cambio de modo a "${modo}" entendido`);
                    await enviarMensaje({
                        tipo: TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_ENTENDIDO,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        destino: mensaje.origen,
                        datos: { 
                            modo, 
                            timestamp: Date.now(),
                            mensajeId: mensaje.datos?.mensajeId || mensaje.id
                        }
                    });

                    // Procesar cambio
                    logger.info(`${logPrefix} Procesando cambio a modo: ${modo}`);
                    estado.retoActualId = null;
                    retoActual = null;
                    if (retoDiv) {
                        retoDiv.innerHTML = "";
                        retoDiv.classList.remove("correct", "incorrect");
                    }
                    ocultarControles();
                    logger.debug(`${logPrefix} Estado de retos reseteado`);
                    actualizarInterfazModo(modo);

                    // Enviar EFECTUADO
                    logger.info(`${logPrefix} Cambio de modo a "${modo}" efectuado`);
                    await enviarMensaje({
                        tipo: TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_EFECTUADO,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        destino: mensaje.origen,
                        datos: { 
                            modo, 
                            exito: true, 
                            timestamp: Date.now(),
                            mensajeId: mensaje.datos?.mensajeId || mensaje.id
                        }
                    });
                } catch (error) {
                    logger.error(`${logPrefix} Error:`, error);
                    try {
                        await enviarMensaje({
                            tipo: TIPOS_MENSAJE.SISTEMA.ERROR,
                            origen: CONFIG_HIJO.IFRAME_ID,
                            destino: mensaje.origen || 'padre',
                            datos: { error: error.message, tipo: 'CAMBIO_MODO_FALLIDO' }
                        });
                    } catch (e) {
                        logger.error(`${logPrefix} Error notificando fallo:`, e);
                    }
                    await enviarMensaje({
                        tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        destino: mensaje.origen,
                        datos: { error: error.message }
                    });
                }
            });

            // Controlador: SISTEMA.CAMBIO_MODO_APLICADO
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO_APLICADO, async (mensaje) => {
                const logPrefix = `[hijo4][CAMBIO_MODO_APLICADO]`;
                try {
                    const { modo } = mensaje.datos || {};
                    logger.success(`${logPrefix} ✅ Cambio de modo a "${modo}" aplicado globalmente`);
                } catch (error) {
                    logger.error(`${logPrefix} Error:`, error);
                }
            });

            // Controlador para solicitar datos de un reto específico
            registrarControladorSeguro(TIPOS_MENSAJE.DATOS.SOLICITAR_RETO, async (mensaje) => {
                const { retoId } = mensaje.datos;
                logger.info(`[hijo4] DATOS.SOLICITAR_RETO recibido para reto: ${retoId}`);

                const reto = retosAventura1Es.find(r => r.id === retoId);
                if (!reto) {
                    logger.warn(`[hijo4] Reto no encontrado: ${retoId}`);
                    await enviarMensaje({
                        destino: mensaje.origen,
                        tipo: TIPOS_MENSAJE.DATOS.RESPUESTA_RETO,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        datos: {
                            mensajeOriginal: mensaje.datos.mensajeId,
                            error: 'Reto no encontrado',
                            retoId
                        }
                    });
                    return;
                }

                // Enviar datos del reto
                await enviarMensaje({
                    destino: mensaje.origen,
                    tipo: TIPOS_MENSAJE.DATOS.RESPUESTA_RETO,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: {
                        mensajeOriginal: mensaje.datos.mensajeId,
                        retoId,
                        reto: {
                            id: reto.id,
                            tipo: reto.tipo,
                            pregunta: reto.pregunta,
                            opciones: reto.opciones,
                            multiple: reto.multiple,
                            correctas: reto.correctas,
                            puzzleSrc: reto.src
                        }
                    }
                });

                logger.info(`[hijo4] Datos del reto enviados: ${retoId}`);
            });

            // Controlador para ocultar el reto
            registrarControladorSeguro(TIPOS_MENSAJE.RETO.OCULTAR, async (mensaje) => {
                logger.info(`[hijo4] RETO.OCULTAR recibido - ocultando reto`);
                
                // Limpiar estado local del reto
                estado.retoActualId = null;
                retoActual = null;
                
                // Limpiar interfaz de reto
                if (retoDiv) {
                    retoDiv.innerHTML = "";
                    retoDiv.classList.remove("correct", "incorrect");
                }
                
                // Ocultar todos los botones
                ocultarControles();
                
                // Limpiar fuegos artificiales
                if (fuegosDiv) {
                    fuegosDiv.innerHTML = "";
                    fuegosDiv.style.display = "none";
                }
                
                logger.info(`[hijo4] Estado y interfaz limpiados tras RETO.OCULTAR`);
            });

            // Controlador para habilitar controles
            registrarControladorSeguro(TIPOS_MENSAJE.CONTROL.HABILITAR, (mensaje) => {
                logger.debug(`[hijo4] CONTROL.HABILITAR recibido`);
                // Implementar lógica para habilitar controles si es necesario
            });

            // Controlador para deshabilitar controles
            registrarControladorSeguro(TIPOS_MENSAJE.CONTROL.DESHABILITAR, (mensaje) => {
                logger.debug(`[hijo4] CONTROL.DESHABILITAR recibido`);
                // Implementar lógica para deshabilitar controles si es necesario
            });

            // Controlador para heartbeat
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT, (mensaje) => {
                logger.debug(`[hijo4] HEARTBEAT recibido`);
                // Responder al heartbeat si es necesario
            });

            // Controlador: SISTEMA.HEARTBEAT.START
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT_START, (mensaje) => {
                try {
                    window.__HEARTBEAT_ACTIVO = true;
                    logger.info(`[hijo4][HEARTBEAT_START] Activado heartbeat local`);
                    return { started: true };
                } catch (error) {
                    logger.error(`[hijo4][HEARTBEAT_START] Error:`, error);
                    return { started: false, error: error && error.message };
                }
            });

            // Controlador: NAVEGACION.CAMBIO_PARADA
            registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA, async (mensaje) => {
                try {
                    const resolved = resolverIdsParada(mensaje.datos || {});
                        const padreId = resolved.padreId;
                        const paradaId = resolved.paradaId;
                        logger.info(`[hijo4][NAVEGACION.CAMBIO_PARADA] recibido: ${padreId || paradaId}`);
                    // update local state such as current challenge if necessary
                    if (paradaId && typeof parseInt === 'function') {
                        // No-op: placeholder for actual reto prefetch logic
                        estado.retoActualId = mensaje.datos?.retoId || null;
                        estado.padreIdActual = padreId || null;
                        estado.paradaIdActual = paradaId || null;
                    }
                    // Send confirmation back to parent
                    await enviarMensaje({
                        destino: mensaje.origen || getPadreId(),
                        tipo: TIPOS_MENSAJE.NAVEGACION.CAMBIO_PARADA_CONFIRMADO,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        datos: { paradaId: paradaId || null, parada_id: paradaId || null, padreId: padreId || null, padreid: padreId || null, timestamp: Date.now() }
                    });
                } catch (e) {
                    logger.warn('[hijo4] Error manejando CAMBIO_PARADA', e);
                }
            });

            // Controlador: SISTEMA.HEARTBEAT.PAUSE
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.HEARTBEAT_PAUSE, (mensaje) => {
                try {
                    window.__HEARTBEAT_ACTIVO = false;
                    logger.info(`[hijo4][HEARTBEAT_PAUSE] Pausado heartbeat local`);
                    return { paused: true };
                } catch (error) {
                    logger.error(`[hijo4][HEARTBEAT_PAUSE] Error:`, error);
                    return { paused: false, error: error && error.message };
                }
            });

            // Controlador para ACK
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.ACK, async (mensaje) => {
                logger.debug(`[hijo4] ACK recibido:`, mensaje.datos);
                // Procesar confirmaciones del padre
            });

            // CONTROLADOR: SISTEMA.NOTIFICACION - manejar PENDING_CANCELADO
            registrarControladorSeguro(TIPOS_MENSAJE.SISTEMA.NOTIFICACION, async (mensaje) => {
                const logPrefix = `[hijo4][NOTIFICACION][${mensaje?.origen || 'desconocido'}]`;
                try {
                    const evento = mensaje.datos?.evento;
                    if (!evento) return;
                    if (evento === 'PENDING_CANCELADO') {
                        const padreId = mensaje.datos?.padreId || mensaje.datos?.padreid || null;
                        const motivo = mensaje.datos?.motivo || 'sin_motivo';
                        logger.info(`${logPrefix} PENDING_CANCELADO recibido para ${padreId}: ${motivo}`);
                        if (padreId && padreId === estado.padreIdActual) {
                            // Hide or reset reto UI
                            try {
                                estado.retoActualId = null;
                                estado.paradaPendiente = false;
                                // Hide controls
                                ocultarControles();
                                // Notify parent that the child processed the notification
                                await enviarMensaje({ tipo: TIPOS_MENSAJE.SISTEMA.ACK, origen: CONFIG_HIJO.IFRAME_ID, destino: mensaje.origen, datos: { mensaje: 'PENDING_CANCELADO procesado', padreId, motivo } });
                            } catch (errPR) { logger.warn(`${logPrefix} Error limpiando UI reto por pending cancelado:`, errPR); }
                        }
                    }
                    if (evento === 'PENDING_INICIADO') {
                        const padreId = mensaje.datos?.padreId || mensaje.datos?.padreid || null;
                        const motivo = mensaje.datos?.motivo || 'iniciado';
                        logger.info(`${logPrefix} PENDING_INICIADO para ${padreId}: ${motivo}`);
                        if (padreId && padreId === estado.padreIdActual) {
                            // Hide any active reto UI and prevent further interaction until pending resolves
                            try {
                                estado.retoActualId = null;
                                estado.paradaPendiente = true;
                                ocultarControles();
                                await enviarMensaje({ tipo: TIPOS_MENSAJE.SISTEMA.ACK, origen: CONFIG_HIJO.IFRAME_ID, destino: mensaje.origen, datos: { mensaje: 'PENDING_INICIADO recibid' } });
                            } catch (err) { logger.warn(`${logPrefix} Error procesando PENDING_INICIADO:`, err); }
                        }
                    }
                } catch (err) {
                    logger.warn(`${logPrefix} Error procesando NOTIFICACION:`, err);
                }
            });

            // Enviar HIJO_PREPARADO ahora que todos los controladores críticos han sido registrados
            try {
                await enviarMensaje({
                    destino: getPadreId(),
                    tipo: TIPOS_MENSAJE.SISTEMA.HIJO_PREPARADO,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: {
                        version: '1.0.0',
                        capacidades: ['retos', 'preguntas', 'validacion'],
                        timestamp: Date.now()
                    }
                });
                logger.debug('[hijo4] HIJO_PREPARADO enviado; esperando PADRE_LISTO');
            } catch (e) {
                logger.warn('[hijo4] Error enviando HIJO_PREPARADO:', e);
            }

            // ============================================================
            // HANDLERS GPS (no-op) - Evitar warnings cuando el padre envía broadcasts
            // ============================================================
            registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.GPS.ACTIVAR, async (mensaje) => {
                try {
                    console.debug(`[hijo4][GPS.ACTIVAR] Recibido ACTIVAR GPS (no-op) desde ${mensaje?.origen}`);
                    return { exito: true };
                } catch (e) {
                    console.error('[hijo4][GPS.ACTIVAR] Error en handler no-op:', e);
                    return { exito: false, error: e.message };
                }
            });

            registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.GPS.DESACTIVAR, async (mensaje) => {
                try {
                    console.debug(`[hijo4][GPS.DESACTIVAR] Recibido DESACTIVAR GPS (no-op) desde ${mensaje?.origen}`);
                    return { exito: true };
                } catch (e) {
                    console.error('[hijo4][GPS.DESACTIVAR] Error en handler no-op:', e);
                    return { exito: false, error: e.message };
                }
            });

            registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.GPS.UBICACION_ACTUALIZADA, async (mensaje) => {
                try {
                    console.debug(`[hijo4][GPS.UBICACION_ACTUALIZADA] Ubicación recibida (no-op)`);
                    return { exito: true };
                } catch (e) {
                    console.error('[hijo4][GPS.UBICACION_ACTUALIZADA] Error en handler no-op:', e);
                    return { exito: false, error: e.message };
                }
            });

            registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.GPS.ESTADO_ACTUALIZADO, async (mensaje) => {
                try {
                    console.debug(`[hijo4][GPS.ESTADO_ACTUALIZADO] Estado GPS recibido (no-op):`, mensaje?.datos || {});
                    return { exito: true };
                } catch (e) {
                    console.error('[hijo4][GPS.ESTADO_ACTUALIZADO] Error en handler no-op:', e);
                    return { exito: false, error: e.message };
                }
            });

            registrarControladorSeguro(TIPOS_MENSAJE.NAVEGACION.GPS.ERROR, async (mensaje) => {
                try {
                    const datos = mensaje?.datos || {};
                    const { codigo } = datos;
                    const errorMensaje = datos.mensaje || datos.message || null;
                    const contexto = datos.contexto || datos.context || 'desconocido';
                    const codeMap = { 1: 'PERMISSION_DENIED', 2: 'POSITION_UNAVAILABLE', 3: 'TIMEOUT' };
                    const codeDesc = codeMap[codigo] || 'UNKNOWN_CODE';
                    let details;
                    try { details = JSON.stringify({ codigo, codeDesc, mensaje: errorMensaje, contexto }, null, 2); } catch (e) { details = `codigo=${codigo} mensaje=${String(errorMensaje)} contexto=${String(contexto)}`; }
                    logger.error(`[hijo4][GPS.ERROR] Error GPS recibido: ${details}`);
                    // Telemetría: incrementar contador por código de error GPS en hijo4
                    try { if (codigo !== undefined) { typeof window.incrementarContador === 'function' && window.incrementarContador(`gps_error_code_${codigo}`); } } catch (err) { /* ignore */ }
                    // Enviar métrica a monitoreo
                    try { if (typeof enviarMensaje === 'function') { enviarMensaje({ tipo: TIPOS_MENSAJE.MONITOREO.METRICA, origen: CONFIG_HIJO.IFRAME_ID || 'hijo4', destino: 'sistema-monitoreo', datos: { nombre: 'gps_error_code', valor: 1, metadatos: { codigo } } }).catch(() => {}); } } catch (ignore) { /* ignore */ }
                return { exito: true };
            } catch (e) {
                logger.error('[hijo4][GPS.ERROR] Error en handler no-op:', e);
                return { exito: false, error: e.message };
            }
        });
            logger.info(`[hijo4] HIJO_LISTO enviado exitosamente tras registrar controladores`);

            estado.inicializado = true;
            logger.info(`[hijo4] Inicialización completada exitosamente`);
        } catch (error) {
            logger.error(`[hijo4] Error en inicialización:`, error);
        }
    }); // Cierre del DOMContentLoaded listener

    </script>
