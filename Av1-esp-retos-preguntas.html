    /**
     * Muestra un reto en la interfaz
     * @param {string} retoId - ID del reto a mostrar
     */
    async function mostrarReto(retoId) {
        const reto = retosAventura1Es.find(r => r.id === retoId);
        if (!reto) {
            logger.error(`[hijo4] Reto no encontrado: ${retoId}`);
            return;
        }

        logger.info(`[hijo4] Mostrando reto: ${retoId}`, { tipo: reto.tipo });
        estado.retoActualId = retoId;

        const tituloEl = document.getElementById('reto-titulo');
        const bodyEl = document.getElementById('reto-body');

        // Actualizar título
        if (tituloEl) {
            tituloEl.textContent = reto.pregunta;
        }

        // Generar contenido del reto
        if (bodyEl) {
            if (reto.tipo === 'puzzle') {
                // Tipo puzzle: mostrar iframe
                bodyEl.innerHTML = `
                    <div class="puzzle-container">
                        <iframe 
                            src="${reto.src}" 
                            width="100%" 
                            height="400px" 
                            frameborder="0"
                            allow="fullscreen"
                            loading="lazy"
                        ></iframe>
                    </div>
                `;
            } else if (reto.tipo === 'opcion' || reto.tipo === 'opcion-multiple') {
                // Tipo opción: mostrar botones
                const multiple = reto.tipo === 'opcion-multiple';
                const html = `
                    <div class="opciones-container">
                        ${multiple ? '<p style="color: #666; font-size: 0.9em; margin-bottom: 10px;">Selecciona todas las opciones correctas:</p>' : ''}
                        ${reto.opciones.map((op, idx) => `
                            <button 
                                class="btn opcion" 
                                data-opcion="${op}"
                                data-index="${idx}"
                                style="display: block; width: 100%; margin: 8px 0; text-align: left; padding: 12px;"
                            >
                                ${multiple ? '☐' : '○'} ${op}
                            </button>
                        `).join('')}
                    </div>
                `;
                bodyEl.innerHTML = html;

                // Configurar event listeners para opciones
                const botonesOpcion = bodyEl.querySelectorAll('.opcion');
                botonesOpcion.forEach(btn => {
                    btn.addEventListener('click', () => manejarSeleccionOpcion(btn, multiple, reto));
                });
            } else if (reto.tipo === 'texto') {
                // Tipo texto: mostrar input
                bodyEl.innerHTML = `
                    <div class="texto-container">
                        <input 
                            type="text" 
                            id="respuesta-texto" 
                            placeholder="Escribe tu respuesta aquí..."
                            style="width: 100%; padding: 12px; font-size: 1em; border: 2px solid #e67e22; border-radius: 5px; margin-bottom: 15px;"
                        >
                        <button 
                            class="btn btn-enviar" 
                            id="btn-enviar"
                            style="background-color: #27ae60; width: 100%;"
                        >
                            Enviar Respuesta
                        </button>
                    </div>
                `;

                // Configurar event listener para el botón enviar
                const btnEnviar = document.getElementById('btn-enviar');
                const inputTexto = document.getElementById('respuesta-texto');
                
                if (btnEnviar && inputTexto) {
                    btnEnviar.addEventListener('click', () => manejarRespuestaTexto(inputTexto, reto));
                    
                    // Permitir enviar con Enter
                    inputTexto.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            manejarRespuestaTexto(inputTexto, reto);
                        }
                    });
                }
            } else {
                // Tipo desconocido
                bodyEl.innerHTML = `<p style="color: #999;">Tipo de reto no soportado: ${reto.tipo}</p>`;
                logger.warn(`[hijo4] Tipo de reto desconocido: ${reto.tipo}`);
            }
        }

        // Mostrar el contenedor
        const container = document.getElementById('reto-container');
        if (container) {
            container.style.display = 'flex';
        }

        // Enviar confirmación al padre de que el reto ha sido mostrado
        await enviarMensaje({
            tipo: TIPOS_MENSAJE.RETO.MOSTRADO,
            origen: CONFIG_HIJO.IFRAME_ID,
            destino: 'padre',
            datos: {
                retoId: retoId,
                tipo: reto.tipo
            }
        });

        logger.success(`[hijo4] Reto mostrado correctamente: ${retoId}`);
    }

    /**
     * Maneja la selección de una opción en un reto de tipo opción
     * @param {HTMLElement} boton - Botón clickeado
     * @param {boolean} multiple - Si es selección múltiple
     * @param {Object} reto - Objeto del reto actual
     */
    function manejarSeleccionOpcion(boton, multiple, reto) {
        const opcionSeleccionada = boton.dataset.opcion;
        
        if (!multiple) {
            // Opción única: desmarcar otros botones
            const todosLosBotones = document.querySelectorAll('.opcion');
            todosLosBotones.forEach(btn => {
                btn.style.backgroundColor = '';
                btn.textContent = btn.textContent.replace('● ', '○ ');
            });
            
            // Marcar botón actual
            boton.style.backgroundColor = '#3498db';
            boton.style.color = 'white';
            boton.textContent = boton.textContent.replace('○ ', '● ');
            
            // Verificar respuesta
            const correcto = reto.correctas.includes(opcionSeleccionada);
            logger.info(`[hijo4] Opción seleccionada: ${opcionSeleccionada}, Correcta: ${correcto}`);
            
            // Notificar al padre inmediatamente
            setTimeout(async () => {
                await enviarMensaje({
                    destino: 'padre',
                    tipo: TIPOS_MENSAJE.RETO.COMPLETADO,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: {
                        retoId: reto.id,
                        respuesta: opcionSeleccionada,
                        correcto,
                        timestamp: Date.now()
                    }
                });
                
                // Ocultar después de 1.5 segundos
                setTimeout(() => ocultarReto(), 1500);
            }, 500);
        } else {
            // Opción múltiple: toggle selección
            const seleccionado = boton.style.backgroundColor === 'rgb(52, 152, 219)'; // #3498db
            
            if (seleccionado) {
                // Desmarcar
                boton.style.backgroundColor = '';
                boton.style.color = '';
                boton.textContent = boton.textContent.replace('☑ ', '☐ ');
            } else {
                // Marcar
                boton.style.backgroundColor = '#3498db';
                boton.style.color = 'white';
                boton.textContent = boton.textContent.replace('☐ ', '☑ ');
            }
            
            logger.info(`[hijo4] Opción multiple toggle: ${opcionSeleccionada}`);
        }
    }

    /**
     * Maneja la respuesta de texto ingresada por el usuario
     * @param {HTMLInputElement} input - Input de texto
     * @param {Object} reto - Objeto del reto actual
     */
    async function manejarRespuestaTexto(input, reto) {
        const respuestaUsuario = input.value.trim();
        
        if (!respuestaUsuario) {
            logger.warn(`[hijo4] Respuesta vacía`);
            input.style.borderColor = '#e74c3c';
            return;
        }
        
        // Verificar respuesta (comparación case-insensitive)
        const correcto = reto.correctas.some(resp => 
            resp.toLowerCase() === respuestaUsuario.toLowerCase()
        );
        
        logger.info(`[hijo4] Respuesta texto: "${respuestaUsuario}", Correcta: ${correcto}`);
        
        // Cambiar color del input según resultado
        input.style.borderColor = correcto ? '#27ae60' : '#e74c3c';
        input.disabled = true;
        
        // Notificar al padre
        await enviarMensaje({
            destino: 'padre',
            tipo: TIPOS_MENSAJE.RETO.COMPLETADO,
            origen: CONFIG_HIJO.IFRAME_ID,
            datos: {
                retoId: reto.id,
                respuesta: respuestaUsuario,
                correcto,
                timestamp: Date.now()
            }
        });
        
        // Ocultar después de 2 segundos
        setTimeout(() => ocultarReto(), 2000);
    }

    // Función para ocultar reto
    function ocultarReto() {
        const container = document.getElementById('reto-container');
        if (container) container.style.display = 'none';
        estado.retoActualId = null;
    }

    try {
        await inicializarMensajeria({
            iframeId: CONFIG_HIJO.IFRAME_ID,
            debug: CONFIG_HIJO.DEBUG
        });

        // ==================== CONTROLADORES DE MENSAJERÍA ====================

        // ============================================================
        // CONTROLADOR 1: SISTEMA.PADRE_LISTO
        // ============================================================
        registrarControlador(TIPOS_MENSAJE.SISTEMA.PADRE_LISTO, async (mensaje) => {
            const logPrefix = `[hijo4][PADRE_LISTO]`;

            try {
                if (!mensaje || !mensaje.origen) {
                    logger.error(`${logPrefix} Mensaje sin origen válido`, mensaje);
                    return;
                }

                logger.info(`${logPrefix} Padre listo confirmado desde ${mensaje.origen}`);

                // ✅ PROCESAR MODO INICIAL DEL PADRE
                if (mensaje.datos && mensaje.datos.modo) {
                    const modoInicial = mensaje.datos.modo;
                    logger.info(`${logPrefix} Procesando modo inicial del padre: ${modoInicial}`);

                    // Aplicar lógica específica del componente
                    actualizarInterfazModo(modoInicial);
                }

                // Enviar HIJO_LISTO al padre para confirmar que estamos listos
                try {
                    await enviarMensaje({
                        destino: 'padre',
                        tipo: TIPOS_MENSAJE.SISTEMA.HIJO_LISTO,
                        origen: 'hijo4',
                        datos: {
                            version: '1.0.0',
                            capacidades: ['retos', 'preguntas', 'validacion'],
                            tiempoInicializacion: Date.now() - (window.tiempoInicio || Date.now()),
                            timestamp: Date.now()
                        }
                    });
                    console.log(`✅ [hijo4] HIJO_LISTO enviado al padre`);
                } catch (error) {
                    console.error(`❌ [hijo4] Error enviando HIJO_LISTO:`, error);
                }

            } catch (error) {
                logger.error(`${logPrefix} Error procesando PADRE_LISTO:`, error);
            }
        });

        /**
         * Controlador: SISTEMA.PADRE_CONFIRMA_HIJO_LISTO
         * Descripción: Recibe confirmación del padre de que los controladores están listos
         * Origen esperado: padre
         * Respuesta: Ninguna (preparado para futuras solicitudes de datos)
         */
        registrarControlador(TIPOS_MENSAJE.SISTEMA.PADRE_CONFIRMA_HIJO_LISTO, async (mensaje) => {
            const logPrefix = `[hijo4][PADRE_CONFIRMA_HIJO_LISTO][${mensaje?.origen || 'desconocido'}]`;

            try {
                if (!mensaje?.origen) {
                    logger.error(`${logPrefix} Mensaje sin origen válido`, mensaje);
                    return;
                }

                logger.info(`${logPrefix} Confirmación recibida del padre - controladores listos`);

                // Preparado para futuras solicitudes de datos adicionales del padre
                logger.debug(`${logPrefix} Componente listo para recibir datos adicionales si es necesario`);

            } catch (error) {
                logger.error(`${logPrefix} Error procesando confirmación del padre:`, error);
            }
        });

        /**
         * Controlador: RETO.MOSTRAR
         * Descripción: Muestra un reto en la interfaz por su ID
         */
        registrarControlador(TIPOS_MENSAJE.RETO.MOSTRAR, (mensaje) => {
            try {
                const { retoId } = mensaje.datos;
                logger.info(`[hijo4] RETO.MOSTRAR recibido para reto: ${retoId}`);
                mostrarReto(retoId);
            } catch (error) {
                logger.error(`[hijo4] Error en RETO.MOSTRAR:`, error);
            }
        });

        /**
         * Controlador: RETO.OCULTAR
         * Descripción: Oculta el reto actual
         */
        registrarControlador(TIPOS_MENSAJE.RETO.OCULTAR, (mensaje) => {
            try {
                logger.info(`[hijo4] RETO.OCULTAR recibido`);
                ocultarReto();
            } catch (error) {
                logger.error(`[hijo4] Error en RETO.OCULTAR:`, error);
            }
        });

        /**
         * Controlador: DATOS.SOLICITAR_RETO
         * Descripción: Busca y devuelve un reto específico por ID
         * Respuesta: DATOS.RESPUESTA_RETO
         *
         * @example
         * // Solicitud básica
         * enviarMensaje({
         *   destino: 'hijo4',
         *   tipo: TIPOS_MENSAJE.DATOS.SOLICITAR_RETO,
         *   datos: { retoId: 'R-5' }
         * });
         *
         * // Solicitud con opciones avanzadas
         * enviarMensaje({
         *   destino: 'hijo4',
         *   tipo: TIPOS_MENSAJE.DATOS.SOLICITAR_RETO,
         *   datos: {
         *     retoId: 'R-5',
         *     incluirEstadisticas: true,
         *     incluirMetadata: true
         *   }
         * });
         */
        registrarControlador(TIPOS_MENSAJE.DATOS.SOLICITAR_RETO, async (mensaje) => {
            const logPrefix = `[hijo4][SOLICITAR_RETO][${mensaje?.origen || 'desconocido'}]`;
            
            try {
                // Validación del mensaje
                if (!mensaje?.origen) {
                    logger.warn(`${logPrefix} Mensaje sin origen, ignorando`);
                    return;
                }
                
                const { 
                    paradaId,
                    tipoConsulta,
                    incluirEstadisticas = false,
                    incluirMetadata = true,
                    incluirRespuestas = false // Seguridad: no enviar respuestas por defecto
                } = mensaje.datos || {};
                
                // Validar datos requeridos según patrón homogéneo
                if (!paradaId) {
                    logger.error(`${logPrefix} paradaId requerido faltante`);
                    return;
                }
                if (!tipoConsulta) {
                    logger.error(`${logPrefix} tipoConsulta requerido faltante`);
                    return;
                }
                if (tipoConsulta !== 'RETOS') {
                    logger.error(`${logPrefix} tipoConsulta inválido: ${tipoConsulta}, esperado: RETOS`);
                    return;
                }
                
                logger.debug(`${logPrefix} Buscando reto para parada ${paradaId}`);
                
                // Buscar el reto en el array por paradaId
                const retoEncontrado = retosAventura1Es.find(r => r.paradaId === paradaId);
                
                if (!retoEncontrado) {
                    logger.warn(`${logPrefix} Reto para parada ${paradaId} NO encontrado`);
                    
                    await enviarMensaje({
                        destino: mensaje.origen,
                        tipo: TIPOS_MENSAJE.DATOS.RESPUESTA_RETO,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        datos: {
                            reto: null,
                            paradaId,
                            encontrado: false,
                            exito: true, // Exito = operación correcta, no reto encontrado
                            mensajeOriginal: mensaje.id
                        }
                    });
                    return;
                }

                // Construir respuesta básica (sin respuestas correctas por seguridad)
                const respuesta = {
                    id: retoEncontrado.id,
                    pregunta: retoEncontrado.pregunta,
                    tipo: retoEncontrado.tipo,
                    reto: retoEncontrado.reto // Número de orden
                };

                // Agregar metadata opcional
                if (incluirMetadata) {
                    if (retoEncontrado.opciones) {
                        respuesta.opciones = [...retoEncontrado.opciones];
                    }
                    
                    if (retoEncontrado.src) {
                        respuesta.src = retoEncontrado.src;
                    }
                    
                    if (retoEncontrado.multiple !== undefined) {
                        respuesta.multiple = retoEncontrado.multiple;
                    }
                }
                
                // SEGURIDAD: Solo incluir respuestas correctas si se solicita explícitamente
                // Esto previene que otros componentes obtengan las respuestas sin autorización
                if (incluirRespuestas && retoEncontrado.correctas) {
                    respuesta.correctas = [...retoEncontrado.correctas];
                    logger.debug(`${logPrefix} Respuestas correctas incluidas (solicitud autorizada)`);
                }

                // Agregar estadísticas opcionales
                if (incluirEstadisticas) {
                    respuesta.estadisticas = {
                        tieneOpciones: !!retoEncontrado.opciones && retoEncontrado.opciones.length > 0,
                        numOpciones: retoEncontrado.opciones ? retoEncontrado.opciones.length : 0,
                        esMultiple: !!retoEncontrado.multiple,
                        esPuzzle: retoEncontrado.tipo === 'puzzle',
                        esTexto: retoEncontrado.tipo === 'texto',
                        esOpcion: retoEncontrado.tipo === 'opcion',
                        esOpcionMultiple: retoEncontrado.tipo === 'opcion-multiple',
                        tieneRespuestas: !!retoEncontrado.correctas && retoEncontrado.correctas.length > 0,
                        numRespuestas: retoEncontrado.correctas ? retoEncontrado.correctas.length : 0,
                        tieneSrc: !!retoEncontrado.src
                    };
                }

                // Enviar RESPONSE con resultado enriquecido
                await enviarMensaje({
                    destino: mensaje.origen,
                    tipo: TIPOS_MENSAJE.DATOS.RESPUESTA_RETO,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: {
                        reto: respuesta,
                        paradaId,
                        encontrado: true,
                        exito: true,
                        mensajeOriginal: mensaje.id
                    }
                });

                logger.info(`${logPrefix} Reto para parada ${paradaId} encontrado: ${retoEncontrado.pregunta}`, {
                    tipo: retoEncontrado.tipo,
                    metadataIncluida: incluirMetadata,
                    respuestasIncluidas: incluirRespuestas,
                    estadisticasIncluidas: incluirEstadisticas
                });
                
            } catch (error) {
                logger.error(`${logPrefix} Error:`, error);
                
                // Enviar RESPONSE con error
                await enviarMensaje({
                    destino: mensaje.origen,
                    tipo: TIPOS_MENSAJE.DATOS.RESPUESTA_RETO,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: {
                        reto: null,
                        retoId: mensaje?.datos?.retoId || mensaje?.datos?.id,
                        encontrado: false,
                        exito: false,
                        error: error.message,
                        mensajeOriginal: mensaje.id
                    }
                });
            }
        });

        /**
         * Controlador: DATOS.SOLICITAR_RETOS
         * Descripción: Busca y devuelve múltiples retos con filtros opcionales
         * Respuesta: DATOS.RESPUESTA_RETOS
         * 
         * @example
         * // Solicitud básica (todos los retos)
         * enviarMensaje({
         *   destino: 'hijo4',
         *   tipo: TIPOS_MENSAJE.DATOS.SOLICITAR_RETOS,
         *   datos: {}
         * });
         * 
         * // Solicitud con filtros avanzados
         * enviarMensaje({
         *   destino: 'hijo4',
         *   tipo: TIPOS_MENSAJE.DATOS.SOLICITAR_RETOS,
         *   datos: {
         *     tipo: 'opcion',           // Filtrar por tipo
         *     filtro: 'torre',          // Buscar en texto
         *     limite: 10,               // Limitar resultados
         *     ordenPor: 'id',           // Ordenar por campo
         *     orden: 'asc',             // Dirección
         *     incluirEstadisticas: true // Incluir stats
         *   }
         * });
         */
        registrarControlador(TIPOS_MENSAJE.DATOS.SOLICITAR_RETOS, async (mensaje) => {
            const logPrefix = `[hijo4][SOLICITAR_RETOS][${mensaje?.origen || 'desconocido'}]`;
            
            try {
                // Validación del mensaje
                if (!mensaje?.origen) {
                    logger.warn(`${logPrefix} Mensaje sin origen, ignorando`);
                    return;
                }
                
                const { 
                    tipo = null,
                    filtro = null,
                    ordenPor = 'reto',
                    orden = 'asc',
                    limite = null,
                    incluirEstadisticas = false,
                    incluirRespuestas = false, // Seguridad: no enviar respuestas por defecto
                    soloPuzzles = false,
                    soloPreguntas = false,
                    soloMultiples = false
                } = mensaje.datos || {};

                logger.debug(`${logPrefix} Buscando retos`, { 
                    tipo, 
                    filtro, 
                    limite,
                    ordenPor,
                    orden,
                    soloPuzzles,
                    soloPreguntas
                });

                let retosFiltrados = [...retosAventura1Es];

                // Aplicar filtro por tipo específico
                if (tipo) {
                    const tipoLower = tipo.toLowerCase();
                    retosFiltrados = retosFiltrados.filter(r => 
                        (r.tipo || '').toLowerCase() === tipoLower
                    );
                    logger.debug(`${logPrefix} Filtrado por tipo '${tipo}': ${retosFiltrados.length} retos`);
                }

                // Aplicar filtros de categoría
                if (soloPuzzles) {
                    retosFiltrados = retosFiltrados.filter(r => r.tipo === 'puzzle');
                    logger.debug(`${logPrefix} Filtrado solo puzzles: ${retosFiltrados.length} retos`);
                }
                
                if (soloPreguntas) {
                    retosFiltrados = retosFiltrados.filter(r => r.tipo !== 'puzzle');
                    logger.debug(`${logPrefix} Filtrado solo preguntas: ${retosFiltrados.length} retos`);
                }
                
                if (soloMultiples) {
                    retosFiltrados = retosFiltrados.filter(r => r.multiple === true);
                    logger.debug(`${logPrefix} Filtrado solo multiples: ${retosFiltrados.length} retos`);
                }

                // Aplicar filtro de texto (búsqueda)
                if (filtro && filtro.trim() !== '') {
                    const terminoBusqueda = filtro.toLowerCase().trim();
                    retosFiltrados = retosFiltrados.filter(r => {
                        const pregunta = (r.pregunta || '').toLowerCase();
                        const id = (r.id || '').toLowerCase();
                        return pregunta.includes(terminoBusqueda) || id.includes(terminoBusqueda);
                    });
                    logger.debug(`${logPrefix} Filtrado por texto '${filtro}': ${retosFiltrados.length} retos`);
                }

                // Validar ordenPor
                const ordenamientosValidos = ['reto', 'id', 'tipo', 'pregunta'];
                const ordenPorValidado = ordenamientosValidos.includes(ordenPor) ? ordenPor : 'reto';
                
                // Validar orden
                const ordenValidado = ['asc', 'desc'].includes(orden) ? orden : 'asc';
                
                if (ordenPorValidado !== ordenPor) {
                    logger.warn(`${logPrefix} Ordenamiento inválido '${ordenPor}', usando 'reto'`);
                }
                
                if (ordenValidado !== orden) {
                    logger.warn(`${logPrefix} Orden inválido '${orden}', usando 'asc'`);
                }

                // Ordenar
                retosFiltrados.sort((a, b) => {
                    let valorA, valorB;
                    
                    switch (ordenPorValidado) {
                        case 'reto':
                            valorA = a.reto || 0;
                            valorB = b.reto || 0;
                            break;
                        case 'id':
                            valorA = a.id || '';
                            valorB = b.id || '';
                            break;
                        case 'tipo':
                            valorA = a.tipo || '';
                            valorB = b.tipo || '';
                            break;
                        case 'pregunta':
                            valorA = (a.pregunta || '').toLowerCase();
                            valorB = (b.pregunta || '').toLowerCase();
                            break;
                        default:
                            valorA = a.reto || 0;
                            valorB = b.reto || 0;
                    }

                    let resultado;
                    if (typeof valorA === 'string') {
                        resultado = valorA.localeCompare(valorB);
                    } else {
                        resultado = valorA > valorB ? 1 : valorA < valorB ? -1 : 0;
                    }

                    return ordenValidado === 'desc' ? -resultado : resultado;
                });

                // Guardar total antes de limitar
                const totalSinLimite = retosFiltrados.length;

                // Validar y aplicar límite
                const limiteValidado = (limite && limite > 0 && limite <= 1000) ? limite : null;
                
                if (limite && limiteValidado !== limite) {
                    logger.warn(`${logPrefix} Límite inválido ${limite}, usando sin límite o máximo 1000`);
                }
                
                if (limiteValidado) {
                    retosFiltrados = retosFiltrados.slice(0, limiteValidado);
                    logger.debug(`${logPrefix} Aplicado límite de ${limiteValidado} retos`);
                }

                // Construir respuesta (sin respuestas correctas por seguridad)
                const retosRespuesta = retosFiltrados.map(r => {
                    const retoResp = {
                        id: r.id,
                        pregunta: r.pregunta,
                        tipo: r.tipo,
                        reto: r.reto,
                        opciones: r.opciones || [],
                        multiple: r.multiple || false,
                        src: r.src || null
                    };
                    
                    // SEGURIDAD: Solo incluir respuestas correctas si se solicita explícitamente
                    if (incluirRespuestas && r.correctas) {
                        retoResp.correctas = [...r.correctas];
                    }
                    
                    return retoResp;
                });

                // Construir respuesta completa
                const respuesta = {
                    retos: retosRespuesta,
                    total: totalSinLimite,
                    devueltos: retosFiltrados.length,
                    filtrosAplicados: {
                        tipo: tipo || null,
                        filtro: filtro || null,
                        ordenPor: ordenPorValidado,
                        orden: ordenValidado,
                        limite: limiteValidado,
                        soloPuzzles,
                        soloPreguntas,
                        soloMultiples
                    }
                };

                // Agregar estadísticas opcionales
                if (incluirEstadisticas) {
                    respuesta.estadisticas = {
                        totalRetos: retosAventura1Es.length,
                        totalEncontrados: totalSinLimite,
                        devueltos: retosFiltrados.length,
                        porTipo: {
                            opcion: retosFiltrados.filter(r => r.tipo === 'opcion').length,
                            opcionMultiple: retosFiltrados.filter(r => r.tipo === 'opcion-multiple').length,
                            texto: retosFiltrados.filter(r => r.tipo === 'texto').length,
                            puzzle: retosFiltrados.filter(r => r.tipo === 'puzzle').length
                        },
                        conOpciones: retosFiltrados.filter(r => r.opciones && r.opciones.length > 0).length,
                        multiples: retosFiltrados.filter(r => r.multiple).length,
                        conRespuestas: retosFiltrados.filter(r => r.correctas && r.correctas.length > 0).length,
                        conSrc: retosFiltrados.filter(r => r.src).length
                    };
                }

                // Enviar RESPONSE con resultado enriquecido
                await enviarMensaje({
                    destino: mensaje.origen,
                    tipo: TIPOS_MENSAJE.DATOS.RESPUESTA_RETOS,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: {
                        ...respuesta,
                        encontrado: totalSinLimite > 0,
                        exito: true,
                        mensajeOriginal: mensaje.id
                    }
                });

                logger.info(`${logPrefix} Retos enviados: ${respuesta.devueltos} de ${totalSinLimite}`, {
                    tipo: tipo || 'todos',
                    filtro: filtro || 'sin filtro',
                    ordenPor: ordenPorValidado,
                    orden: ordenValidado,
                    limite: limiteValidado || 'sin límite',
                    estadisticasIncluidas: incluirEstadisticas,
                    respuestasIncluidas: incluirRespuestas
                });
                
            } catch (error) {
                logger.error(`${logPrefix} Error:`, error);
                
                // Enviar RESPONSE con error
                await enviarMensaje({
                    destino: mensaje.origen,
                    tipo: TIPOS_MENSAJE.DATOS.RESPUESTA_RETOS,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: {
                        retos: [],
                        total: 0,
                        devueltos: 0,
                        encontrado: false,
                        exito: false,
                        error: error.message,
                        mensajeOriginal: mensaje.id
                    }
                });
            }
        });

        /**
         * Controlador: SISTEMA.CAMBIO_MODO
         * Descripción: Actualiza la interfaz según el modo (casa/aventura)
         */
        registrarControlador(TIPOS_MENSAJE.SISTEMA.CAMBIO_MODO, async (mensaje) => {
            const logPrefix = `[hijo4][CAMBIO_MODO]`;
            const CONFIG_HIJO = { IFRAME_ID: 'hijo4' };

            try {
                // Paso 1: Validar carga secuencial - esperar permiso del padre
                if (!mensaje.datos?.secuenciaCompleta) {
                    logger.warn(`${logPrefix} Mensaje recibido antes de secuencia completa, esperando permiso...`);
                    // Enviar NACK y esperar mensaje de PERMISO_INICIALIZACION
                    await enviarMensaje({
                        tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        destino: mensaje.origen,
                        datos: { error: 'Secuencia no completa', esperarPermiso: true }
                    });
                    return;
                }

                // Paso 2: Extraer datos con destructuring
                const { modo } = mensaje.datos || {};

                // Paso 3: Validar datos extraídos
                if (!modo || !['casa', 'aventura'].includes(modo)) {
                    logger.error(`${logPrefix} Modo inválido o faltante: ${modo}`);
                    await enviarMensaje({
                        tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        destino: mensaje.origen,
                        datos: { error: 'Modo inválido', modoRecibido: modo }
                    });
                    return;
                }

                // Paso 4: Loggear éxito y procesar
                logger.info(`${logPrefix} Procesando cambio a modo: ${modo}`);

                // Aplicar lógica específica del componente
                actualizarInterfazModo(modo);

                // Paso 5: Enviar confirmación
                await enviarMensaje({
                    tipo: TIPOS_MENSAJE.SISTEMA.CONFIRMACION,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    destino: mensaje.origen,
                    datos: { modo, exito: true, timestamp: Date.now() }
                });

            } catch (error) {
                logger.error(`${logPrefix} Error procesando cambio de modo:`, error);
                // Enviar NACK en caso de error
                await enviarMensaje({
                    tipo: TIPOS_MENSAJE.SISTEMA.NACK,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    destino: mensaje.origen,
                    datos: { error: error.message, timestamp: Date.now() }
                }).catch(nackError => logger.error(`${logPrefix} Error enviando NACK:`, nackError));
            }
        });

        /**
         * Controlador: SISTEMA.HEARTBEAT
         * Descripción: Responde a heartbeat del padre para verificar conectividad
         */
        registrarControlador(TIPOS_MENSAJE.SISTEMA.HEARTBEAT, (mensaje) => {
            enviarMensaje({
                destino: mensaje.origen,
                tipo: TIPOS_MENSAJE.SISTEMA.HEARTBEAT_RESPONSE,
                origen: CONFIG_HIJO.IFRAME_ID,
                datos: { timestamp: Date.now() }
            });
            logger.debug(`[hijo4] HEARTBEAT recibido, respuesta enviada.`);
        });

        // Controlador para ACK del sistema
        registrarControlador(TIPOS_MENSAJE.SISTEMA.ACK, async (mensaje) => {
            const logPrefix = `[hijo4][SISTEMA.ACK][${mensaje?.origen || 'desconocido'}]`;
            
            try {
                logger.debug(`${logPrefix} ACK recibido, respondiendo...`);
                
                // Responder al ACK
                await enviarMensaje({
                    destino: 'padre',
                    tipo: TIPOS_MENSAJE.SISTEMA.ACK,
                    origen: CONFIG_HIJO.IFRAME_ID,
                    datos: {
                        componenteId: CONFIG_HIJO.COMPONENTE_ID,
                        timestamp: Date.now(),
                        estado: 'activo'
                    }
                });
                
                logger.debug(`${logPrefix} ACK respondido`);
                
            } catch (error) {
                logger.error(`${logPrefix} Error respondiendo ACK:`, error);
            }
        });

        // ==================== INICIALIZACIÓN ====================

        await enviarMensaje({
            destino: 'padre',
            tipo: TIPOS_MENSAJE.SISTEMA.HIJO_LISTO,
            origen: CONFIG_HIJO.IFRAME_ID,
            datos: { componenteId: CONFIG_HIJO.COMPONENTE_ID }
        });

        // Configurar event listeners para botones del DOM
        configurarEventListenersBotones();

        estado.inicializado = true;
        logger.info(`[hijo4] Inicialización completada exitosamente`);
    } catch (error) {
        logger.error(`[hijo4] Error durante la inicialización:`, error);
        try {
            await enviarMensaje({
                destino: 'padre',
                tipo: TIPOS_MENSAJE.SISTEMA.HIJO_FALLIDO,
                origen: CONFIG_HIJO.IFRAME_ID,
                datos: { error: error.message }
            });
        } catch (notifyError) {
            logger.error(`[hijo4] Error notificando fallo:`, notifyError);
        }
    }

    // ==================== FUNCIONES AUXILIARES ====================

    /**
     * Configura los event listeners para los botones de la interfaz
     */
    function configurarEventListenersBotones() {
        const btnCompletado = document.getElementById('btn-completado');
        const btnOcultar = document.getElementById('btn-ocultar');

        if (btnCompletado) {
            btnCompletado.addEventListener('click', async () => {
                try {
                    logger.info(`[hijo4] Botón 'Completado' clickeado`);
                    
                    // Obtener el reto actual
                    const retoActual = retosAventura1Es.find(r => r.id === estado.retoActualId);
                    
                    // Enviar notificación de reto completado
                    await enviarMensaje({
                        destino: 'padre',
                        tipo: TIPOS_MENSAJE.RETO.COMPLETADO,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        datos: {
                            retoId: estado.retoActualId,
                            correcto: true,
                            timestamp: Date.now(),
                            tipo: retoActual?.tipo || 'desconocido'
                        }
                    });
                    
                    // Ocultar el reto
                    ocultarReto();
                    
                    logger.success(`[hijo4] Reto completado notificado`);
                } catch (error) {
                    logger.error(`[hijo4] Error al completar reto:`, error);
                }
            });
        }

        if (btnOcultar) {
            btnOcultar.addEventListener('click', async () => {
                try {
                    logger.info(`[hijo4] Botón 'Ocultar' clickeado`);
                    
                    // Notificar al padre que se oculta el reto
                    await enviarMensaje({
                        destino: 'padre',
                        tipo: TIPOS_MENSAJE.RETO.OCULTAR,
                        origen: CONFIG_HIJO.IFRAME_ID,
                        datos: {
                            retoId: estado.retoActualId,
                            razon: 'usuario_oculto',
                            timestamp: Date.now()
                        }
                    });
                    
                    // Ocultar el reto
                    ocultarReto();
                    
                    logger.success(`[hijo4] Reto ocultado`);
                } catch (error) {
                    logger.error(`[hijo4] Error al ocultar reto:`, error);
                }
            });
        }

        logger.info(`[hijo4] Event listeners configurados correctamente`);
    }

    // Implementar pagehide para limpiar recursos
    window.addEventListener('pagehide', () => {
        logger.info(`[hijo4] Limpiando recursos en pagehide`);
        estado.inicializado = false;
    });
    </script>

</head>
<body>
    <div id="reto-container" class="reto-container">
        <div class="reto-header">
            <h2 id="reto-titulo">Título del Reto</h2>
        </div>
        <div id="reto-body" class="reto-body">
            <p>Aquí va la descripción del reto...</p>
        </div>
        <div class="reto-footer">
            <button id="btn-completado" class="btn btn-completado">¡Reto Completado!</button>
